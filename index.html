<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{

/* ================= shared ================= */
#app{position:fixed;inset:0;display:grid;grid-template-rows:calc(var(--hdr) + var(--sat)) 1fr 26px}
#banner{

#main{display:grid;grid-template-columns:352px 1fr;min-height:0}

.grab{display:none}

.tabs button.on{color:var(--tx);border-bottom-color:var(--gold)}
.pane{display:none;flex-direction:column;min-height:0;flex:1}

.ctl{padding:9px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
#q{

}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip .n{color:var(--tx3);font-size:9.5px;font-weight:700}
.chip.on{color:#0d1117;background:var(--tx);border-color:var(--tx)}

.rowlbl{font-size:9.5px;color:var(--tx3);font-weight:700;letter-spacing:.5px;margin-top:9px}

#bar{padding:6px 11px;font-size:10.5px;color:var(--tx3);border-bottom:1px solid var(--line);flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
#bar b{color:var(--gold);font-size:12px}

.item.sel{background:#1e2a36}

.item .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

  :root{--hdr:44px}

  #banner h1{font-size:13.5px}

  #banner .kpi div{padding:0 8px}

  .leaflet-control-attribution{margin:6px 0 0 6px!important;border-radius:5px;padding:1px 5px!important}
  #foot{display:none}
  #main{grid-template-columns:1fr}
  #legend{display:none}
  #gps{top:auto;bottom:calc(var(--peek) + var(--sab) + 12px);width:46px;height:46px;font-size:19px}

  #side{
    position:fixed;left:0;right:0;bottom:0;z-index:900;
    height:86dvh;max-height:86dvh;border-right:none;
    background:#141c26;
    border-top:1px solid #2e3a49;border-radius:16px 16px 0 0;

    transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding-bottom:var(--sab);
    touch-action:none;
  }
  #side.drag{transition:none}
  .grab{display:block;padding:8px 0 4px;flex:0 0 auto;cursor:grab}
  .grab .bar{width:38px;height:4px;border-radius:2px;background:#3d4c5c;margin:0 auto}
  .tabs button{padding:11px 0;font-size:13px}
  .ctl{padding:9px 12px}
  .rowlbl{margin-top:10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-top:6px}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:6px 11px;font-size:12px}
  #bar{padding:8px 12px}
  .mini{padding:5px 11px;font-size:11.5px}
  .item{padding:10px 13px}
  .item .nm{font-size:14px}
  .leaflet-popup-content{width:250px!important}
  .pop .ds{max-height:70px}
  .leaflet-control-zoom{display:none}
}
@supports not (height:100dvh){ @media (max-width:820px){ #side{height:86vh;max-height:86vh} } }
</style>

of skewers arrive to delight us, including grilled eel liver, ribs, and fin rich with its flavour.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/hashimoto","short":"2-5-7 Suido"},{"id":"1213418","name":"Ma Poule","ja":"マ プール","lat":35.716254,"lng":139.757224,"ward":"Bunkyo-ku","wardKo":"분쿄","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2-19-17 Nishikata, Bunkyo-ku","postal":"113-0024","tel":"+81 3-3868-2518","img":"https://prod-pics.guide.michelin.com/api/public/content/23d56b1b824d4e48a9ef0f541345ef97.jpg?format=jpeg&w=1000&h=1000","desc":"The chef opened a small restaurant, Ma Poule to celebrate the appeal of Jura, in eastern France. This region, with its beautiful forests, valleys and wetlands and its wonderful ingredients and people, made a profound impression on the chef. Chicken and morels in sauce vin jaune is a Jura dish in which the chef takes great pride. This dish is paired with specially produced yellow wine. The façade and interior, and even proprietress’s clothing, are yellow as well. A restaurant filled with love of Jura.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ma-poule","short":"2-19-17 Nishikata"},{"id":"1194262","name":"Watabe","ja":"わたべ","lat":35.711314,"lng":139.752119,"ward":"Bunkyo-ku","wardKo":"분쿄","cuisine":"Unagi / Freshwater Eel","cuisineKo":"장어","group":"일식","price":"¥¥","addr":"1-9-14 Koishikawa, Bunkyo-ku","postal":"112-0002","tel":"+81 3-3812-7448","img":"https://prod-pics.guide.michelin.com/api/public/content/809f304f31084677892908b840a1fdf5.jpeg?format=jpeg&w=1000&h=1000","desc":"Watabe was founded as a fishmonger but morphed into a restaurant when it became known for the delicious eel the owner grilled at his shop. ‘Enma-ju’, which features both shirayaki, eel grilled without seasoning, and kabayaki, eel dipped and broiled in sweet sauce, served over rice in a box, is a tribute to Konnyaku-Enma, a deity enshrined in nearby Genkaku-ji Temple. In the evening, the menu takes on a distinctly French cast, with items such as terrine of kabayaki and foie gras and smoked eel with Brie de Meaux cheese. Eel cuisine Watabe style, with foundations in French cuisine, is the aim here.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/watabe","short":"1-9-14 Koishikawa"},{"id":"1212774","name":"wokotote","ja":"をことて","lat":35.720302,"lng":139.763506,"ward":"Bunkyo-ku","wardKo":"분쿄","cuisine":"Japanese","cuisineKo":"일식","group":"일식","price":"¥¥","addr":"2-35-1 Nezu, Bunkyo-ku","postal":"113-0031","tel":"+81 3-5834-2144","img":"https://prod-pics.guide.michelin.com/api/public/content/60048950831342208da34eee44723308.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef studied the art of kaiseki multi-course meals. In addition to omakase set meals, he serves prix fixe meals to which à la carte items can be added, so diners can enjoy Japanese cuisine as they please. Sashimi is accompanied by a dipping sauce of malted rice and fish sauce; mixed platters of drinking snacks include grilled and fried items prepared with care. The shop name is inspired by grammatical particles used to form sentences in Japanese. Cuisine, people, drinks and interior blend agreeably together, so relax and let time flow by.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/wokotote","short":"2-35-1 Nezu"},{"id":"1240749","name":"Biriyani Osawa","ja":"ビリヤニ大澤","lat":35.69221,"lng":139.76607,"ward":"Chiyoda-ku","wardKo":"지요다","cuisine":"Indian","cuisineKo":"인도","group":"아시아","price":"¥","addr":"B1F, 1-15-12 Uchikanda, Chiyoda-ku","postal":"101-0047","tel":"+81 3-6687-9853","img":"https://prod-pics.guide.michelin.com/api/public/content/d78a4ea270e94686842413433bb2df5a.jpeg?format=jpeg&w=1000&h=1000","desc":"Once served in royal courts, biryani later became a beloved dish among the public. This rice dish, cooked with spices and various ingredients, is the restaurant’s sole offering—made with either mutton or chicken. The basmati rice is richly fragrant, with distinct, separate grains. Oil is used sparingly, to bring the umami of the ingredients and the flavours of the spices to the fore. Meal preparation is carefully timed so the biryani finishes cooking just as all guests are seated, ensuring everyone enjoys it in all its fresh-from-the-pot deliciousness. Passion and spirit imbue every dish.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/biriyani-osawa","short":"1-15-12 Uchikanda"},{"id":"1201781","name":"SANTOSHAM","ja":"三燈舎","lat":35.694763,"lng":139.762667,"ward":"Chiyoda-ku","wardKo":"지요다","cuisine":"Indian","cuisineKo":"인도","group":"아시아","price":"¥","addr":"2F, 3-2 Kandaogawamachi, Chiyoda-ku","postal":"101-0052","tel":"+81 50-3697-2547","img":"https://prod-pics.guide.michelin.com/api/public/content/450f04bd32dd4d70803dcc4f76346ee6.jpeg?format=jpeg&w=1000&h=1000","desc":"The cuisine of Kerala, a state on India’s southwest coast, takes the limelight here. The owner-couple, along with a chef from Kerala, are consummate ambassadors for the appeal of this culinary discipline. The sweetness of coconut, the pungency of curry leaves and the flavour of black pepper are standout features. Kerala is a coastal state, so seafood features prominently. Santosham means ‘happiness’ in the Malayalam language; the name is a prayer that good food and happiness will go hand in hand here.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/santosham","short":"3-2 Kandaogawamachi"},{"id":"1193850","name":"ARROCERÍA La Panza","ja":"アロセリア ラ パンサ","lat":35.673366,"lng":139.770106,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Spanish","cuisineKo":"스페인","group":"유럽","price":"¥¥","addr":"1-15-8 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6228-6793","img":"https://prod-pics.guide.michelin.com/api/public/content/cd630a21d7164b179dab72219568a1d3.jpg?format=jpeg&w=1000&h=1000","desc":"This restaurant specialises in Spanish rice cuisine. Sample rice dishes from every region of Spain: paella, said to be from Valencia; clams and rice cooked in a clay pot, from Basque Country; and caldero, rice simmered in an iron pot, from Mar Menor. Gathering around a table and sharing the same pot captures the joy of Spanish food culture. The range of appetisers, including dry-cured ham and tapas, is impressive. ‘Panza’ means ‘pot belly’, and you’re sure to leave satisfied in both stomach and soul.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/arroceria-la-panza","short":"1-15-8 Ginza"},{"id":"1200563","name":"Bistrot Vivienne","ja":"ビストロ ヴィヴィエンヌ","lat":35.669678,"lng":139.768817,"ward":"Chuo-ku","wardKo":"주오","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"4-13-19 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6273-2830","img":"https://prod-pics.guide.michelin.com/api/public/content/aaa62b67bff242cd939a583c5b608322.jpeg?format=jpeg&w=1000&h=1000","desc":"A bistro run by a sommelier and chef. Keen to impart a sense of everyday life in France, the partners focus on charcuterie and hometown cooking. Populating the menu are delights such as cassoulet, quenelle and beef cheek simmered in wine. Respecting the classics, dishes baked in pie pastry are also included. In keeping with the regional tenor of the bistro, wines of every region are here for the asking; pair them with dishes of the same region for the consummate mariage.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/bistrot-vivienne","short":"4-13-19 Ginza"},{"id":"1194050","name":"Chukasoba Ginza Hachigou","ja":"中華そば 銀座 八五","lat":35.670563,"lng":139.770185,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"3-14-2 Ginza, Chuo-ku","postal":"104-0061","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/e94dc2d44b0445d689c9b7b5dc95e306.jpeg?format=jpeg&w=1000&h=1000","desc":"Aiming to provide a full-course meal in a bowl, the chef infuses Chinese soba with his experience in French cuisine for a unique touch. Most revolutionary is the absence of sauce. The soup is crafted by extracting flavours as if for a consommé and then perfectly balancing them with the saltiness of cured ham. The wontons are filled with a paste of foie gras and truffles. He combines all the Western ingredients he has mastered over the years into a single bowl.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/chukasoba-ginza-hachigo","short":"3-14-2 Ginza"},{"id":"1240750","name":"Ginza HARU CHAN Ramen","ja":"銀座はるちゃんラーメン","lat":35.67082,"lng":139.768831,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"3-11-6 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6260-6088","img":"https://prod-pics.guide.michelin.com/api/public/content/3baea9e5ee4945c68663dd887b745460.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef, known to all as Haru-chan, pours all her energies into her shio ramen. The clear broth of pork and dried sardines is poured to the rim of the bowl. The colours of green onion, nori and wheat bran ‘flowers’ floating in wisps of pork fat make a comforting sight. Noodles are pounded flat for a satisfyingly plump texture. Roasted pork fillet, simmered with the soup, brings the whole dish together. To stay close to the community it serves, the restaurant remains open even between lunch and dinner times.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ginza-haru-chan-ramen","short":"3-11-6 Ginza"},{"id":"1217982","name":"GINZA KATSUKAMI II","ja":"ぎんざ かつかみ弐","lat":35.670064,"lng":139.762822,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥¥","addr":"4F, Kojun Bldg, 6-8-7 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6264-6775","img":"https://prod-pics.guide.michelin.com/api/public/content/00b3e42a3dbb4a26bd1357fa8ae54f2b.jpg?format=jpeg&w=1000&h=1000","desc":"Service at this tonkatsu restaurant is prix fixe only. Along with the familiar fillet and pork loin cutlets, you’ll find rare cuts such as rump and round tip, fried one slice at a time. Several name-brand pork varieties are available to taste and compare, each one tender and succulent. A few unexpected entries, such as minced pork burgers, add whimsy into the mix. It’s a concept that makes sense: unique prix fixe menus of tonkatsu, each item served piping hot from the kitchen.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ginza-katsukami-ii","short":"6-8-7 Ginza"},{"id":"1194133","name":"Hamacho Kaneko","ja":"浜町 かねこ","lat":35.684005,"lng":139.788273,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"3-7-3 Nihombashihamacho, Chuo-ku","postal":"103-0007","tel":"+81 3-4291-3303","img":"https://prod-pics.guide.michelin.com/api/public/content/e0c330b5c602427fb1f96f9a1ffda9d4.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef loves the culture of soba-mae, which refers to enjoying sake and snacks before the soba arrives. A full range of drinking snacks are available to tempt you, including baked devil’s tongue coated with miso, and simmered beef sinew. Tempura varies with the seasons, ranging from shrimp and conger eel to edible wild plants, young sweetfish, mushroom and oyster. Soba is 100% buckwheat noodles, cut thin. Dipping sauces are varied as well, including sesame, grated yam and curry. Meoto, meaning ‘married couple’ is a popular dish combining soba with udon.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/hamacho-kaneko","short":"3-7-3 Nihombashihamacho"},{"id":"1206470","name":"HOPPERS","ja":"ホッパーズ","lat":35.681353,"lng":139.778125,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Sri Lankan","cuisineKo":"스리랑카","group":"아시아","price":"¥¥","addr":"7-1 Nihombashikabutocho, Chuo-ku","postal":"103-0026","tel":"+81 3-6890-1547","img":"https://prod-pics.guide.michelin.com/api/public/content/ea1aa79f850e4cce90b7e9dd7496b145.jpeg?format=jpeg&w=1000&h=1000","desc":"Love of spices inspires the chef of this house of Sri Lankan cuisine. When he says the national dish of Sri Lanka is ‘rice and curry’, he doesn’t just mean rice with curry. The phrase refers specifically to a set menu of several types of curry, side dishes, and rice. In keeping with tradition, the curry is made with Maldive fish, a type of shaved bonito. Distinctively, the rice is a mixture of basmati rice and Japanese rice.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/hoppers-1206470","short":"7-1 Nihombashikabutocho"},{"id":"1193900","name":"Katsuyoshi","ja":"かつ好","lat":35.686215,"lng":139.781217,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"3-4-11 Nihombashiningyocho, Chuo-ku","postal":"103-0013","tel":"+81 3-6231-0641","img":"https://prod-pics.guide.michelin.com/api/public/content/162762fb15ea4e1b853e3aa6b0340ed8.jpeg?format=jpeg&w=1000&h=1000","desc":"You’ll find Katsuyoshi in a back-alley of Ningyocho. The interior of the shop, a refurbished traditional home, uses recycled wood to convey a retro feel. In the kitchen, you’ll see two copper pots. When deep-frying pork cutlets, the owner-chef uses hotter oil for some dishes and cooler oil for others. Fried seafood morsels such as scallop and tiger prawn are popular. If you get a seat at the counter, you can watch the chef’s work, which starts with preparing the meat.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/katsuyoshi","short":"3-4-11 Nihombashiningyocho"},{"id":"1194222","name":"LA BETTOLA da Ochiai","ja":"ラ・ベットラ・ダ・オチアイ","lat":35.672764,"lng":139.771142,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"1-21-2 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-3567-5656","img":"https://prod-pics.guide.michelin.com/api/public/content/9a277ab02b95466c953008b19a63acfb.jpeg?format=jpeg&w=1000&h=1000","desc":"‘La Bettola’ is Italian for ‘the dining hall’. With its casual atmosphere and fare that is good value for money, this trattoria draws throngs of guests day after day. The menu is crammed with regional cuisines and seasonal dishes. The prix fixe selection allows a choice of items—you’ll find it hard to make up your mind. For the appetiser, we recommend the combination platter, generous in both portions and variety. Sea urchin spaghetti is a perennial favourite.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/la-bettola-da-ochiai","short":"1-21-2 Ginza"},{"id":"1214700","name":"Le Nougat","ja":"ヌガ","lat":35.669271,"lng":139.764924,"ward":"Chuo-ku","wardKo":"주오","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"6-12-2 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6254-5105","img":"https://prod-pics.guide.michelin.com/api/public/content/1662111d27124323b120ac78f7e844a2.jpeg?format=jpeg&w=1000&h=1000","desc":"The restaurant’s name is inspired by a chanson song. Inside, red bench seating, French movie posters and chanson playing in the background all recreate the feel of a Paris bistro. The menu is an assemblage of French village fare. Each plateful serves two, encouraging sharing. With an extensive list of wines from every region of France, many available by the glass, you can delight in the experience of pairing your dish with wines of the same region.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/le-nougat","short":"6-12-2 Ginza"},{"id":"1194247","name":"Les Copains de DOMINIQUE BOUCHET","ja":"レ・コパン ドゥ ドミニク・ブシェ","lat":35.671997,"lng":139.761755,"ward":"Chuo-ku","wardKo":"주오","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"B1F, 5-1-8 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6264-6566","img":"https://prod-pics.guide.michelin.com/api/public/content/ba059add41ae44b1ae5420b0340a73ab.jpeg?format=jpeg&w=1000&h=1000","desc":"A bistro by Dominique Bouchet. The theme is ‘bistronomy’: a bistro with added gastronomic enhancements. Favourites such as pâté en croûte and steak frites are everyday standards in France. Lobster macaroni is a Bouchet speciality that captures the hearts of Parisian epicures. Savour the profundity of French cuisine from popular fare to modern haute cuisine.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/les-copains-de-dominique-bouchet","short":"5-1-8 Ginza"},{"id":"1193882","name":"Osteria da K. [káppa]","ja":"オステリア ダ カッパ","lat":35.668851,"lng":139.761527,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"5F, 8-7-2 Ginza, Chuo-ku","postal":"104-0061","tel":"+81 3-6274-6620","img":"https://prod-pics.guide.michelin.com/api/public/content/dc8e86f9686c414da507f51396e5e691.jpeg?format=jpeg&w=1000&h=1000","desc":"An osteria presented by a sushi shop. After apprenticing in Italy, the chef helped out at a sushi restaurant before taking charge here. Seafood, procured from the chef’s personal sources, catches the eye. Cut ends of abalone and fish make a seafood ragù for pasta, born from meals prepared for employees. Acqua pazza is enhanced with kombu water for an even more delicious dish. Cuisine that brings out the best in the ingredients, backed by the skills of Italy and Japan.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/osteria-da-k-kappa","short":"8-7-2 Ginza"},{"id":"1217754","name":"Yaesu Unagi Hashimoto","ja":"八重洲 鰻 はし本","lat":35.681677,"lng":139.771301,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Unagi / Freshwater Eel","cuisineKo":"장어","group":"일식","price":"¥¥","addr":"1-5-10 Yaesu, Chuo-ku","postal":"103-0028","tel":"+81 50-1808-6166","img":"https://prod-pics.guide.michelin.com/api/public/content/1ae56600066f497ba208b2f1db2a96cf.jpeg?format=jpeg&w=1000&h=1000","desc":"An old wooden sign catches the eye: ‘Unagi – eat this, and there is no need for medicine.’ This reflects the founder’s belief in eel as a nourishing food. The fourth-generation chef honours tradition while adapting to the present. The Unatsugu-ju carries the spirit of passing eel culture to the future, with efforts to release juvenile eels into the sea to replenish wild stocks. In step with the times, a counter seat offers a view of the craftsmen at work.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/yaesu-unagi-hashimoto","short":"1-5-10 Yaesu"},{"id":"1194199","name":"YAMATO","ja":"ヤマト","lat":35.688123,"lng":139.784335,"ward":"Chuo-ku","wardKo":"주오","cuisine":"Izakaya","cuisineKo":"이자카야","group":"일식","price":"¥¥","addr":"16-3 Nihombashitomizawacho, Chuo-ku","postal":"103-0006","tel":"+81 3-3661-8010","img":"https://prod-pics.guide.michelin.com/api/public/content/3887cd874f6542249b534774d9902ba9.jpg?format=jpeg&w=1000&h=1000","desc":"Here the speciality is chargrilled vegetables and seafood. Guests gather around the hearth and charcoal brazier to enjoy the rising aroma of the seafood and vegetables while savouring sake. Among the favourites are the large clams and dried, salted ichiyaboshi fish. Seasonal delicacies like bamboo shoots and mushrooms are also available. The proprietress expertly handles the grilling duties, carefully tending to the charcoal fire. ‘Yamato’ is the name of her family's river fish shop, serving as the inspiration for the owner's charcoal cooking.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/yamato-1194199","short":"16-3 Nihombashitomizawacho"},{"id":"1193863","name":"Ittoan","ja":"一東菴","lat":35.763091,"lng":139.728912,"ward":"Kita-ku","wardKo":"기타","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"2-16-10 Higashijujo, Kita-ku","postal":"114-0001","tel":"+81 3-6903-3833","img":"https://prod-pics.guide.michelin.com/api/public/content/08102e3763514a5a8953716900b95ee6.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef helps out on farms all over Japan, forming bonds of trust with farmers. If you’re interested in the differences among various kinds of soba, we recommend the ‘Sanshu Seiro’, three kinds of soba served on a wickerwork tray. He grinds and kneads each soba differently according to type and region of origin, so the character of each shines through. Sometimes, the chef says, he mixes coarse-ground and fine-ground soba from the same region. His tireless curiosity yields a never-ending variety of flavours.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ittoan","short":"2-16-10 Higashijujo"},{"id":"1194088","name":"TRATTORIA BUCA'MASSIMO","ja":"トラットリア ブカ・マッシモ","lat":35.670349,"lng":139.798513,"ward":"Koto-ku","wardKo":"고토","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"1-24-11 Tomioka, Koto-ku","postal":"135-0047","tel":"+81 3-5809-9022","img":"https://prod-pics.guide.michelin.com/api/public/content/1ce9f81f2d0c4ebcbf73f0f768edf517.jpeg?format=jpeg&w=1000&h=1000","desc":"‘A backstreet Italian eatery’ is how this trattoria bills itself. The chef professes his love of Tuscany through his cooking, which includes crostini of chicken-liver paste; beef tripe simmered in the Florentine style; Pici, akin to a thick spaghetti, in tomato ragú is a Sienese primo piatto. The meat elegantly grilled over charcoal flame is best enjoyed with a bottle of red wine.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/trattoria-buca-massimo","short":"1-24-11 Tomioka"},{"id":"1193817","name":"AUDACE","ja":"アウダチェ","lat":35.64477,"lng":139.697899,"ward":"Meguro-ku","wardKo":"메구로","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"3-8-1 Kamimeguro, Meguro-ku","postal":"153-0051","tel":"+81 3-6451-2146","img":"https://prod-pics.guide.michelin.com/api/public/content/8cf9a7308de74f188391922411e8950d.jpeg?format=jpeg&w=1000&h=1000","desc":"Guests gather around one large table and the kitchen and dining room meld into one as the sounds and aromas of cooking drift on the air. The menu features hometown cooking with touches of originality. Veal in tuna sauce is enlivened with saffron; gorgonzola and green peppers are added to pasta with tomato sauce. Mains such as beef and pork are grilled simply over charcoal.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/audace","short":"3-8-1 Kamimeguro"},{"id":"1194243","name":"Le Monde Gourmand","ja":"ル モンド グルマン","lat":35.608524,"lng":139.672178,"ward":"Meguro-ku","wardKo":"메구로","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2-17-15 Midorigaoka, Meguro-ku","postal":"152-0034","tel":"+81 3-5726-8657","img":"https://prod-pics.guide.michelin.com/api/public/content/dc4d179ef499434e96cf6d921bd9b040.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef is experienced in the gastronomic ways of both Tokyo and Paris. Intent on reaching new heights while broadening the base of French cuisine, he opened a bistro. He showcases his talents with items baked in pie pastry. Beef simmered in red wine and potato au gratin highlight the appeal of regional cuisines. ‘Le Monde Gourmand’ translates as ‘the world of the food lover’, and as the name suggests, this is the place to sample the world of fine dining in a casual setting.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/le-monde-gourmand","short":"2-17-15 Midorigaoka"},{"id":"1206635","name":"Ramen Break Beats","ja":"ラーメン ブレイクビーツ","lat":35.633515,"lng":139.698778,"ward":"Meguro-ku","wardKo":"메구로","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"4-21-19 Meguro, Meguro-ku","postal":"153-0063","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/95bde8f4e83c4d548643f125b71c4f2c.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef was a DJ in a former life, and the technique he applied in that calling, break beats, informs both the name of the restaurant and the music piped through the dining room. The signature dish is soy-sauce ramen, which owes its beautiful presentation and clear soup to careful preparation of the noodles. The purity of the broth delights the palate from the first mouthful. With rhythmic tempo, you’ll reel in the noodles and drink every drop of soup before you know it. A beat-driven bowl that hit big in Meguro.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ramen-break-beats","short":"4-21-19 Meguro"},{"id":"1240752","name":"Teuchi Asama","ja":"手打ち あさま","lat":35.64274,"lng":139.698022,"ward":"Meguro-ku","wardKo":"메구로","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"2-13-7 Kamimeguro, Meguro-ku","postal":"153-0051","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/9e67127e3eb24d40834926440ef56259.jpg?format=jpeg&w=1000&h=1000","desc":"The inclusion of ‘teuchi’ in the shop’s name reflects the distinctive quality of its handmade noodles—flat and springy. Dough is prepared daily and rested overnight, capturing the full flavour of the wheat. Noodles are cut when orders are placed, then kneaded to vary the texture. Mellow, flavoursome soup combines broth of chicken and seafood with ‘kaeshi’, a blend of soy sauce, sugar and mirin. Time and hard work deepen the flavour of each bowlful.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/teuchi-asama","short":"2-13-7 Kamimeguro"},{"id":"1194197","name":"YAKUMO","ja":"八雲","lat":35.65014,"lng":139.686847,"ward":"Meguro-ku","wardKo":"메구로","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"3-6-15 Higashiyama, Meguro-ku","postal":"153-0043","tel":"+81 3-6303-3663","img":"https://prod-pics.guide.michelin.com/api/public/content/18a247d69f624d01abea6ed12e436f93.png?format=jpeg&w=1000&h=1000","desc":"Customers flock to Yakumo for its famous wonton ramen. Two types of wonton, one with pork infused with the tang of ginger and the other with shrimp cooked to delightful texture, each play their part in the dish’s popularity. To enjoy both, order the special ‘Tokusei’ ramen. The choice of soups is ‘White dashi’ made with white soy sauce, ‘Black dashi’ using rich, dark soy sauce, and ‘Mix’, a mixture of the two. And choose from thin noodles or flat. This flexibility to tailor your order is a special pleasure of Yakumo.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/yakumo","short":"3-6-15 Higashiyama"},{"id":"1201866","name":"AlCeppo","ja":"アルチェッポ","lat":35.644588,"lng":139.731574,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"2F, 1-25-32 Shirokane, Minato-ku","postal":"108-0072","tel":"+81 3-5424-1331","img":"https://prod-pics.guide.michelin.com/api/public/content/07b96db7b3b14408972b8ad3d0664458.jpeg?format=jpeg&w=1000&h=1000","desc":"Italy and Japan have much in common: a geography elongated north to south, for example, and a balance of four seasons. The features of both countries inform the menu of AlCeppo. From his experience touring the length and breadth of Italy, the chef expresses the local cuisine of each region through seasonal ingredients. From spring to summer, the fare of southern Italy is offered, typically focusing on fish and vegetables dressed in olive oil. From autumn to winter, northern cooking, such as mushrooms and stewed game, becomes the focus. A joy to visit in every season.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/alceppo","short":"1-25-32 Shirokane"},{"id":"1200411","name":"IRUCA TOKYO","ja":"入鹿 TOKYO","lat":35.664771,"lng":139.731691,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"4-12-12 Roppongi, Minato-ku","postal":"106-0032","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/53eea0d852f94683b2d8661a91c87c25.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef displays his originality in each bowl as he pursues a unique interpretation of ramen. Broths of clam, spiny lobster, free-range chicken and beef combine to create a soup of satisfying depth. Paste of porcini mushrooms and truffles switches up the flavour of soy-sauce ramen. Salt ramen is infused with yuzu flavoured butter to impart a creamy fragrance. ‘Iruca’ comes from the Japanese for ‘dolphin’, a symbol of peace and a message of friendship to spread across the oceans.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/iruca-tokyo","short":"4-12-12 Roppongi"},{"id":"1202771","name":"L'AS","ja":"ラス","lat":35.666014,"lng":139.717125,"ward":"Minato-ku","wardKo":"미나토","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"4-16-3 Minamiaoyama, Minato-ku","postal":"107-0062","tel":"+81 80-3310-4058","img":"https://prod-pics.guide.michelin.com/api/public/content/c8491946150d44aaac643dba0d39f667.jpeg?format=jpeg&w=1000&h=1000","desc":"Simple yet refined fare, enjoyed in a casual setting. Keen to make French cuisine familiar to his clientele, the chef offers great taste at a reasonable price. Guests can enjoy their meals as if they were gathered around their own dinner tables. The chef changes the menu monthly, greeting diners with something different each time they visit. Cooks also bring dishes to tables for a seamlessly integrated dining experience.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/l-as","short":"4-16-3 Minamiaoyama"},{"id":"1194257","name":"LAUBURU","ja":"ローブリュー","lat":35.659959,"lng":139.716589,"ward":"Minato-ku","wardKo":"미나토","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"6-8-18 Minamiaoyama, Minato-ku","postal":"107-0062","tel":"+81 3-3498-1314","img":"https://prod-pics.guide.michelin.com/api/public/content/629a8dcd34624e4292201e5c654dacee.jpeg?format=jpeg&w=1000&h=1000","desc":"The number ‘64’ on the door refers to France’s 64th department: Pyrénées-Atlantiques, in the Basque Country. A devotee of pork culture, Shinichiro Sakurai is a lover of all things Basque, especially its pork cuisine. Having learned from charcuterie, Chef Sakurai places pork dishes front and centre: pâté and pig’s-head terrine as appetisers, boudin noir as a main dish. The Basque spirit lives and breathes in this back alley off Kotto-dori Street.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/lauburu","short":"6-8-18 Minamiaoyama"},{"id":"1214972","name":"Les six","ja":"レ シス","lat":35.651815,"lng":139.722428,"ward":"Minato-ku","wardKo":"미나토","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2F, 5-15-25 Minamiazabu, Minato-ku","postal":"106-0047","tel":"+81 3-6826-2764","img":"https://prod-pics.guide.michelin.com/api/public/content/36614cd2cbfd44bdac15704b6f554c3d.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef mixes his own sensibilities into cuisine rooted in French bistro fare. The blackboard menu is a medley of authentic dishes and à la carte items made with seasonal ingredients. Generally, an appetiser and a main course is the perfect amount, but some items can be ordered as half portions, so ask your server.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/les-six","short":"5-15-25 Minamiazabu"},{"id":"1194175","name":"Ma Cuisine","ja":"マ・キュイジーヌ","lat":35.660937,"lng":139.7267,"ward":"Minato-ku","wardKo":"미나토","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"B1F, 1-2-14 Nishiazabu, Minato-ku","postal":"106-0031","tel":"+81 3-6455-4426","img":"https://prod-pics.guide.michelin.com/api/public/content/1d18415cfd7d4ca3983956ab0451b472.jpeg?format=jpeg&w=1000&h=1000","desc":"Ratatouille, cassoulet, beef cheek simmered in red wine: familiar regional fare covers the blackboard menu. Special attention is paid to Tokushima pork, which stars in numerous menu entries. Taking pride in the ingredients’ flavours, the chef shares a passion in common with the producers he relies on. A full range of pork cuisine is available, including cutlets and charcuterie. Ingredients are lightly salted to bring out their flavour, and portions are generous. The traditions of French food culture on full display.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ma-cuisine-1194175","short":"1-2-14 Nishiazabu"},{"id":"1196609","name":"Osobano Kouga","ja":"おそばの甲賀","lat":35.660055,"lng":139.722767,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"2-14-5 Nishiazabu, Minato-ku","postal":"106-0031","tel":"+81 3-3797-6860","img":"https://prod-pics.guide.michelin.com/api/public/content/35cf729b979846f7a011fbc954ba797e.jpeg?format=jpeg&w=1000&h=1000","desc":"Taste sake and snacks while dining on soba. Think of the culture of the soba shop, the beloved essence of Edo popular culture, plunked down near Nishi-Azabu Intersection for the modern generation to enjoy, and you have the atmosphere of Osobano Kouga. Evenings bring prix fixe presentations that encourage you to linger over cups of sake. Tensui, tempura soba with the soba removed, is an old-timey snack. Soba in season and appetisers of vegetable or fish of the day are a delight.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/osobano-kouga","short":"2-14-5 Nishiazabu"},{"id":"1195319","name":"ROZZO SICILIA","ja":"ロッツォ シチリア","lat":35.646974,"lng":139.731756,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"1-1-12 Shirokane, Minato-ku","postal":"108-0072","tel":"+81 3-5447-1955","img":"https://prod-pics.guide.michelin.com/api/public/content/ec01053e900944808e983fbba9ca26c6.jpeg?format=jpeg&w=1000&h=1000","desc":"The largest island in the Mediterranean, Sicily has flourished for centuries as a hub of trade, so the cuisines of many lands have been passed down here. The unique local dishes that sprang up on this island captured the heart of ROZZO SICILIA’s chef. Authentic recipes are valued, including aubergine caponata, fennel and sardine pasta and seafood couscous. Lemon as an essential accompaniment is another traditional touch. The chef’s cherished goal is to craft flavours that remind Sicilians of home.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/rozzo-sicilia","short":"1-1-12 Shirokane"},{"id":"1194028","name":"Soba Tajima","ja":"蕎麦 たじま","lat":35.654728,"lng":139.726132,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"3-8-6 Nishiazabu, Minato-ku","postal":"106-0031","tel":"+81 3-3445-6617","img":"https://prod-pics.guide.michelin.com/api/public/content/ce13d2a020be4a76b47eaed846fd2937.jpeg?format=jpeg&w=1000&h=1000","desc":"A soba shop well stocked with vegetable cuisine in season. From the varied and extensive menu, choose an assortment of small items as well as vegetable dishes, and cap the meal with the soba of your choice. The surfeit of options can be bewildering but of course you can order soba one plate at a time. If you arrive at lunchtime, set menus of rice dishes await you as well. Seasoned staff serve with practiced skill and grace, welcoming you like a local no matter when you visit.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/soba-tajima","short":"3-8-6 Nishiazabu"},{"id":"1213152","name":"Sushi Mikata","ja":"鮨 三か田","lat":35.647756,"lng":139.741381,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Sushi","cuisineKo":"스시","group":"일식","price":"¥¥","addr":"4-1-4 Mita, Minato-ku","postal":"108-0073","tel":"+81 70-8340-4141","img":"https://prod-pics.guide.michelin.com/api/public/content/101a6f53b62f443bbb4f4af0684c4aff.jpeg?format=jpeg&w=1000&h=1000","desc":"The origins of Sushi Mikata go back to a standup sushi bar the chef went to with his father when he was a boy. Aiming to be a place where people could drop in casually for sushi, he emulated this standup format. Guests can order in amounts as small as one piece at a time. Both fish and vinegared-rice portions are generous, to impart the delightful feeling of filling one’s mouth. The chef runs Sushi Mikata with his wife, whose rolled Japanese-style omelettes are a hit with customers. The good-humoured banter between husband and wife keeps the atmosphere light.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sushi-mikata","short":"4-1-4 Mita"},{"id":"1194041","name":"T'astous","ja":"タストゥー","lat":35.649953,"lng":139.737004,"ward":"Minato-ku","wardKo":"미나토","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2-5-21 Minamiazabu, Minato-ku","postal":"106-0047","tel":"+81 3-6435-4722","img":"https://prod-pics.guide.michelin.com/api/public/content/2e10105eef4f4c53a42a3ad396beb323.jpeg?format=jpeg&w=1000&h=1000","desc":"T’astous presents as a ‘neo-bistro’, the sort of chic bistro you might find in Paris. Regional cooking arranged for a modern sensibility. The chef trained in the south of France, so he excels with foie gras and truffles that are this region’s gift to the world. The restaurant name is the word for a black-truffle canapé in the Cahors dialect. He expresses through his cuisine the wonder he felt upon tasting this delicacy in southwestern France.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/t-astous","short":"2-5-21 Minamiazabu"},{"id":"1201658","name":"Tachigui Sushi Tonari","ja":"立喰 鮨となり","lat":35.655547,"lng":139.734852,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Sushi","cuisineKo":"스시","group":"일식","price":"¥¥","addr":"2F, 2-8-7 Azabujuban, Minato-ku","postal":"106-0045","tel":"+81 3-6453-9950","img":"https://prod-pics.guide.michelin.com/api/public/content/3b0575a2d61c4423976516246f10c74b.jpeg?format=jpeg&w=1000&h=1000","desc":"Sushi Tonari means ‘sushi next door’, and indeed Tachigui Sushi Tonari is tucked away next to its flagship restaurant. The intimate space, quick turnover and experience of the youthful staff achieve a comfortable informality. Ordering is refreshingly casual, too: requesting one piece at a time is fine. The prevailing theme is ‘vinegar and sushi’. Rice seasoned with rice vinegar harmonises beautifully with the oil of the fish. Reservations, orders and billing are all managed on a digital system. Standing and eating, Edo’s street-stall dining culture, updated for the modern era.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tachigui-sushi-tonari","short":"2-8-7 Azabujuban"},{"id":"1200419","name":"Tempura Kakiage Yukimura","ja":"天ぷら かき揚げ 之村","lat":35.661982,"lng":139.75356,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Tempura","cuisineKo":"텐푸라","group":"일식","price":"¥","addr":"6-13-13 Shimbashi, Minato-ku","postal":"105-0004","tel":"+81 3-6721-5343","img":"https://prod-pics.guide.michelin.com/api/public/content/001b7dc92eb648299c54259e4ad3c798.jpeg?format=jpeg&w=1000&h=1000","desc":"‘Cheerful, fun, exciting’ sums up the credo of the owner-chef. The convivial atmosphere and friendly service attracts customers of every generation. The menu reflects this positive attitude, with bowls of rice with toppings, teishoku set meals and à la carte items available at both lunch and dinner. The dish of fame is the kakiage-don, a bowl of rice loaded up with shrimp. The chef treasures the advice he learned as an apprentice: ‘Offer top-rate food at third-rate prices’. He’s always smiling, trading jokes with his guests.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tempura-kakiage-yukimura","short":"6-13-13 Shimbashi"},{"id":"1240815","name":"Yoshoku Edoya","ja":"洋食 エドヤ","lat":35.644408,"lng":139.725583,"ward":"Minato-ku","wardKo":"미나토","cuisine":"Yoshoku","cuisineKo":"요쇼쿠","group":"일식","price":"¥","addr":"6-6-1 Shirokane, Minato-ku","postal":"108-0072","tel":"+81 3-6721-9885","img":"https://prod-pics.guide.michelin.com/api/public/content/f7f961b16d404c1d9ef8aa5273a0dae3.jpeg?format=jpeg&w=1000&h=1000","desc":"Yoshoku Edoya traces its establishment to1954, when its founder, having studied Western cuisine, converted a Japanese confectionery shop into a restaurant – it still bears the name it had at its founding. The perennial favourite here is hamburger steak, served with a generous helping of demi-glace and topped with a fried egg. The skills with which the beef is kneaded and grilled to lock in juices are those of a master craftsman. Flavours of the good old days make perfect companions for rice. Yoshoku Edoya honors both its own culinary heritage and the traditions of Western-style Japanese cuisine.<p><\/p><p><\/p>","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/yoshoku-edoya","short":"6-6-1 Shirokane"},{"id":"1194012","name":"Sushi Yoshino","ja":"鮨 与志乃","lat":35.697528,"lng":139.679189,"ward":"Nakano-ku","wardKo":"나카노","cuisine":"Sushi","cuisineKo":"스시","group":"일식","price":"¥¥","addr":"B1F, 2-30-2 Chuo, Nakano-ku","postal":"164-0011","tel":"+81 3-3371-8426","img":"https://prod-pics.guide.michelin.com/api/public/content/95969d05a274451f93732fec5eeaac3c.jpeg?format=jpeg&w=1000&h=1000","desc":"The founder of Sushi Yoshino was once an apprentice at a well-known sushi restaurant in Tokyo’s Kyobashi district. When he became independent, he inherited the shop name, and now his heir and son have hung out their shingle together. Sushi toppings prepared in the old-school way are paired with sushi rice made with red vinegar. The shop captivates with the spirit of a true sushi restaurant. Lighting is used effectively in view of the basement location and the long counter of zelkova wood is a striking feature. Enjoy craftsmanship in both the sushi and the décor.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sushi-yoshino","short":"2-30-2 Chuo"},{"id":"1218270","name":"Teuchisoba Jiyusan","ja":"手打蕎麦 じゆうさん","lat":35.729935,"lng":139.677122,"ward":"Nakano-ku","wardKo":"나카노","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥¥","addr":"3-1-4 Eharacho, Nakano-ku","postal":"165-0023","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/f96b22a7d1c940a8a9638991206946eb.jpeg?format=jpeg&w=1000&h=1000","desc":"‘Jiyusan’ is a shop on Mejiro Street. The name is a play on the street’s old name, ‘Jusanken-dori’. Delicately thin seiro soba, made purely from buckwheat served on a wicker tray, offers a pleasing finish. Inaka soba is stone-ground by hand, one grain at a time using a pestle and mortar, and delivers a rich, deep flavour. Appetisers, patiently prepared using techniques the chef learned during his apprenticeship, set the tone—such as shrimp prepared in miso and grilled, or herring fillet simmered slowly over several days.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/teuchisoba-jiyusan","short":"3-1-4 Eharacho"},{"id":"1241612","name":"Sobakiri Suzuki","ja":"そばきり すゞ木","lat":35.746817,"lng":139.572337,"ward":"Nerima-ku","wardKo":"네리마","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"4-43-32 Minamioizumi, Nerima-ku","postal":"178-0064","tel":"+81 3-5387-2010","img":"https://prod-pics.guide.michelin.com/api/public/content/b4a47211c0b34ca39e3e99758b36448d.jpeg?format=jpeg&w=1000&h=1000","desc":"Tucked away in a quiet residential neighbourhood, this soba shop welcomes guests only at lunchtime. The interior is done entirely in natural materials such as wood and stone, lending a homespun feel. Service is friendly and welcoming, placing the heart at ease. The menu consists solely of sobazen a set meal including fine soba noodles, appetisers, and soba-gaki. For those who prefer something sweet, the soba-gaki can be substituted with soba zenzai, a red bean soup made with the same buckwheat dough in dessert form. Quantities are limited so reservations are a must and can be made by phone from around 9:30 a.m. on the day.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sobakiri-suzuki","short":"4-43-32 Minamioizumi"},{"id":"1193988","name":"Shinjiko Shijimi Chukasoba Kohaku","ja":"宍道湖しじみ中華蕎麦 琥珀","lat":35.551272,"lng":139.711199,"ward":"Ota-ku","wardKo":"오타","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"2-1-3 Nishirokugo, Ota-ku","postal":"144-0056","tel":"+81 3-6690-0893","img":"https://prod-pics.guide.michelin.com/api/public/content/cb711ebe04be4c279f2506589778e0a7.jpg?format=jpeg&w=1000&h=1000","desc":"After taking over his mother’s restaurant, the owner-chef opened his doors in the town where he was born and raised. The key to the flavour lies in the shijimi clams from Lake Shinji in Shimane Prefecture, after which the restaurant is named. The soup utilizes the umami of the shellfish’s succinic acid. To enjoy the true taste of the broth, we recommend the salt-flavoured option. The names of the fishermen who caught each day's clams are written on the blackboard, showing respect for both ingredients and producers.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/shinjiko-shijimi-chukasoba-kohaku","short":"2-1-3 Nishirokugo"},{"id":"1194097","name":"Tonkatsu Enraku","ja":"とんかつ 燕楽","lat":35.57294,"lng":139.704233,"ward":"Ota-ku","wardKo":"오타","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"6-1-4 Ikegami, Ota-ku","postal":"146-0082","tel":"+81 3-3754-8243","img":"https://prod-pics.guide.michelin.com/api/public/content/ed218791f4194c9898461dd7ed15a1ee.jpeg?format=jpeg&w=1000&h=1000","desc":"The veteran owner-chef has devoted his life to tonkatsu pork cutlets. As he fries pork loin and fillet, he concentrates on the changing colour of the coatings and the hiss of oil in the copper pot. Cabbage is chopped by hand as the pork sizzles. Deft, precise movements calculated with the final result in mind reassure guests. Craftsmanship learned the old-fashioned way, through patient repetition of the master’s lessons, reflects a stance of uncompromising commitment.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tonkatsu-enraku","short":"6-1-4 Ikegami"},{"id":"1194261","name":"Washokuya Taichi","ja":"和食や 太いち","lat":35.604993,"lng":139.685082,"ward":"Ota-ku","wardKo":"오타","cuisine":"Izakaya","cuisineKo":"이자카야","group":"일식","price":"¥¥","addr":"3-36-14 Kitasenzoku, Ota-ku","postal":"145-0062","tel":"+81 3-6425-9122","img":"https://prod-pics.guide.michelin.com/api/public/content/344e61464d014ec78ede4a48aa9f7b17.jpeg?format=jpeg&w=1000&h=1000","desc":"The generously portioned, inventive dishes reflect the chef’s desire to satisfy. The signature Taichi Salad is piled high with over 30 types of vegetable. Whether cut, grilled, steamed or fried, each dish is prepared to bring out the flavour of the ingredients. The seasonal specials listed on the blackboard are also inviting. In summer, fragrant roast corn with butter soy sauce is this restaurant’s speciality. Each season brings a reason to return.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/washokuya-taichi","short":"3-36-14 Kitasenzoku"},{"id":"1194144","name":"BISTRO GLOUTON","ja":"ビストロ グルトン","lat":35.648675,"lng":139.682312,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2-33-7 Ikejiri, Setagaya-ku","postal":"154-0001","tel":"+81 3-3410-5517","img":"https://prod-pics.guide.michelin.com/api/public/content/0c1a13c077044ae29778c86b083f8251.jpeg?format=jpeg&w=1000&h=1000","desc":"From down a back alley in Ikejiri, light beckons from a counter bistro. Draw closer and a crowded blackboard lists such a range of items, from French regional cuisine to Western-influenced dishes like hamburger steaks and croquettes, that you’ll hardly be able to choose. The menu doesn’t change, to keep quality consistent and high. ‘Glouton’ refers to someone who enjoys their food whole-heartedly. Every item here will tickle your fancy, and once you’ve sampled the food here, you’ll want to return.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/bistro-glouton","short":"2-33-7 Ikejiri"},{"id":"1200268","name":"DIALOGUE","ja":"ディアログ","lat":35.664959,"lng":139.669812,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"3-23-21 Kitazawa, Setagaya-ku","postal":"155-0031","tel":"+81 3-6804-8820","img":"https://prod-pics.guide.michelin.com/api/public/content/dbe52c9053eb48c4a34459d27fb822d5.jpg?format=jpeg&w=1000&h=1000","desc":"Since the days of their apprenticeship, the chef and sommelier have encouraged each other through friendly rivalry. Their decision to locate DIALOGUE in a residential area stems from their desire to become a familiar face to the region. Lunches are prix fixe; dinners, à la carte. Much-loved French standards populate the menu. True to its name, the restaurant offers a sprawling menu in hopes that the choices available will stimulate conversation. The fun of choosing and the joy of tasting bring hearts together.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/dialogue-1200268","short":"3-23-21 Kitazawa"},{"id":"1218206","name":"Gigio","ja":"ジージョ","lat":35.644595,"lng":139.654755,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"4-24-19 Wakabayashi, Setagaya-ku","postal":"154-0023","tel":"+81 3-6805-4949","img":"https://prod-pics.guide.michelin.com/api/public/content/0619c6ec95bc414c9c686c79fe42ebc6.jpg?format=jpeg&w=1000&h=1000","desc":"A trattoria where à la carte dining is encouraged with a comprehensive menu of regional cuisines. Pici served with tomato ragú laden with garlic and vegetable sformato are all flavours learned in the Italian countryside. A marble bar counter and Tuscan-style stone walls create a stylish space inspired by interiors in Tuscany. Steps from Shoin Shrine, this is Italian food culture with deep roots in daily life.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/gigio","short":"4-24-19 Wakabayashi"},{"id":"1194227","name":"LANBRoA","ja":"ランブロア","lat":35.628673,"lng":139.636268,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"Spanish","cuisineKo":"스페인","group":"유럽","price":"¥¥","addr":"3-11-15 Yoga, Setagaya-ku","postal":"158-0097","tel":"+81 3-6432-7017","img":"https://prod-pics.guide.michelin.com/api/public/content/02f9eca2a1ce42bcb9be725840215936.jpeg?format=jpeg&w=1000&h=1000","desc":"The menu lists dishes from every corner of Spain, every one a precious memory of the chef. The preponderance of Basque dishes reflects her attendance of a cooking school in San Sebastián and apprenticeship at a restaurant there. We start with pintxo (pinchos), an apt choice for the Spanish pub atmosphere. Piquillo pepper stuffed with dried and salted cod, squid simmered in its ink and other Basque-country favourites are faithfully reproduced here. Experience the food culture of Spain.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/lanbroa","short":"3-11-15 Yoga"},{"id":"1194228","name":"Lien","ja":"リアン","lat":35.651263,"lng":139.681147,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"3-5-22 Ikejiri, Setagaya-ku","postal":"154-0001","tel":"+81 3-6413-8552","img":"https://prod-pics.guide.michelin.com/api/public/content/9deca5b7a07f4e23ab20eec2837c9d91.jpg?format=jpeg&w=1000&h=1000","desc":"‘Lien’ is French for ‘connection’. The chef, a native of Aomori Prefecture, uses both ingredients and crockery from that region of northern Honshu. Serving salmon from the Tsugaru Strait and Aomori Shamorock chicken on Tsugaru Kanayama Yaki pottery, the chef connects guests with producers through his cuisine. The comprehensive prix fixe menu is imbued with this sense of human connection. ‘Lien’ may mean a feeling of connection, but it also means a bond.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/lien","short":"3-5-22 Ikejiri"},{"id":"1194022","name":"Seki Hanare","ja":"セキ ハナレ","lat":35.6428,"lng":139.649926,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"Japanese","cuisineKo":"일식","group":"일식","price":"¥¥","addr":"3-1-3 Setagaya, Setagaya-ku","postal":"154-0017","tel":"+81 3-5450-5870","img":"https://prod-pics.guide.michelin.com/api/public/content/3a904f27f47f4b68a8c6308d9851dad8.jpeg?format=jpeg&w=1000&h=1000","desc":"Creative dining focused on affinity with sake. Appetisers are served as a combination platter, the better to keep the libations flowing. Tsukuri feature ingenious arrangements of condiments. Uniquely, meat dishes are an indispensable part. Each dish is generous, making every morsel an unforgettable memory. The collection of sake and shochu, amassed on visits to breweries, is impressive; as the shop specialises in local tipples, the wine and whisky selection is also strictly Japanese.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/seki-hanare","short":"3-1-3 Setagaya"},{"id":"1194081","name":"Tohakuan Karibe","ja":"東白庵 かりべ","lat":35.663492,"lng":139.602984,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"4-23-19 Kasuya, Setagaya-ku","postal":"157-0063","tel":"+81 3-6879-8998","img":"https://prod-pics.guide.michelin.com/api/public/content/0d8ff0e0db294089a9f200cdd2da6f64.jpg?format=jpeg&w=1000&h=1000","desc":"With the temperament of an artist, the chef places everything in its proper proportion. Gathering unpolished buckwheat from Nagano and Niigata, he grinds the two together, checking moisture by hand to produce nihachi and juwari noodles. Soba and broth are served in harmony: as seiro, accompanied by soup redolent of katsuobushi, or as kake, steeped in hot katsuobushi broth. Side dishes are soba-shop favourites, such as Pacific herring simmered for days or seafood and buckwheat flour wrapped in nori and deep-fried.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tohakuan-karibe","short":"4-23-19 Kasuya"},{"id":"1240867","name":"ZUPPERIA OSTERIA PITIGLIANO","ja":"ズッペリア・オステリア・ピティリアーノ","lat":35.643044,"lng":139.606484,"ward":"Setagaya-ku","wardKo":"세타가야","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"2F, 3-4-9 Soshigaya, Setagaya-ku","postal":"157-0072","tel":"+81 3-3789-0017","img":"https://prod-pics.guide.michelin.com/api/public/content/a74a28f0674246f7ba2f5495f34792c2.jpg?format=jpeg&w=1000&h=1000","desc":"Pitigliano is a town the chef visited in his apprenticeship and has fond memories of. During his time in Italy, the chef was deeply impressed by the custom of ‘zuppa’, or dipping pieces of bread into soups of vegetables and beans, so the menu offers an extensive selection of soups. Honest flavours and presentations mirror the food culture of the Italian countryside, featuring simple handmade pasta and char-grilled fish and meat. Scenes of diners sharing from a single plate are a reflection of daily life in Italy.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/zupperia-osteria-pitigliano","short":"3-4-9 Soshigaya"},{"id":"1193849","name":"Arrocería Sal y Amor","ja":"アロセリア サル イ アモール","lat":35.65085,"lng":139.703514,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Spanish","cuisineKo":"스페인","group":"유럽","price":"¥¥","addr":"B1F, 12-19 Daikanyamacho, Shibuya-ku","postal":"150-0034","tel":"+81 3-5428-6488","img":"https://prod-pics.guide.michelin.com/api/public/content/3c8bc218ac334640bf98aa56e03a9a60.jpeg?format=jpeg&w=1000&h=1000","desc":"Folk songs play in the background of the exotic interior as dishes are ordered in Spanish all around you. An arroceron is a restaurant specialising in rice dishes. In addition to the familiar ‘paella’, here you’ll find ‘meloso’, a dish similar to risotto; ‘caldoso’, a dish of rice in broth; and a great variety of other offerings. Rice, the must-have ingredient for every dish, is a carefully selected, Japan-grown brand. Foods of Japan and Spain, brought together by rice.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/arroceria-sal-y-amor","short":"12-19 Daikanyamacho"},{"id":"1194159","name":"BRAMASOLE","ja":"ブラマソーレ","lat":35.670999,"lng":139.713757,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"3-42-5 Jingumae, Shibuya-ku","postal":"150-0001","tel":"+81 3-6434-0615","img":"https://prod-pics.guide.michelin.com/api/public/content/ca7c65758f174ab2a23d8898822c0460.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef honed his craft in multiple regions of Italy and the menu reflects this. Oven-baked aubergine and tomato, for example, was learned in Sicily in the south, while pasta in beef and pork ragù was acquired from Emilia-Romagna in the north. The menu is mainly à la carte, so that guests can sample his creations freely. Diners can choose long or short pasta according to preference.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/bramasole","short":"3-42-5 Jingumae"},{"id":"1193935","name":"Cristiano's","ja":"クリスチアノ","lat":35.668592,"lng":139.689062,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Portuguese","cuisineKo":"포르투갈","group":"유럽","price":"¥¥","addr":"1-51-10 Tomigaya Shibuya-ku","postal":"151-0063","tel":"+81 3-5790-0909","img":"https://prod-pics.guide.michelin.com/api/public/content/72dfbad3037943dfa410aa6d12ff7323.jpeg?format=jpeg&w=1000&h=1000","desc":"Japan and Portugal built a friendship during the Nanban trading era that has never faltered. The two countries share a culinary culture of fish and rice and a love of local cooking enjoyed at the family table. Items served include tempura octopus, char-grilled sardines, takikomi-gohan and gruel-like risotto. There’s also an extensive menu of à la carte options. Like the Portuguese wine, this fare is meant to be shared.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/cristiano-s","short":"1-51-10 Tomigaya Shibuya-ku"},{"id":"1194153","name":"falò","ja":"ファロ","lat":35.650023,"lng":139.704283,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"B1F, 14-10 Daikanyamacho, Shibuya-ku","postal":"150-0034","tel":"+81 3-6455-0206","img":"https://prod-pics.guide.michelin.com/api/public/content/c63d714ef5a247679b538cdc6fcdea8b.jpeg?format=jpeg&w=1000&h=1000","desc":"The counter kitchen arrayed around a hearth suggests an open-air bonfire. The eyes are riveted to the chef as he grills the meat, throwing charcoal on the fire. The use of grilling close to the flame, grilling over an open hearth and directly placing ingredients on the charcoal, brings the ingredients and brightly burning charcoal into a tight embrace. Porchetta, patiently cooked for over an hour, is a popular item. Straw-grilled fish and foil-grilled vegetables whet curiosity and appetite. The chef works with practiced ease, laser-focused on the foodstuffs.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/falo","short":"14-10 Daikanyamacho"},{"id":"1199632","name":"Hibino Chukashokudo","ja":"日々の中華食堂","lat":35.669108,"lng":139.680787,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Chinese","cuisineKo":"중식","group":"중식","price":"¥¥","addr":"1-33-11 Uehara, Shibuya-ku","postal":"151-0064","tel":"+81 3-5790-9655","img":"https://prod-pics.guide.michelin.com/api/public/content/4b9be4a2ef01486095c629949ff0c77b.jpeg?format=jpeg&w=1000&h=1000","desc":"Inside a modern space enveloped in the warmth of wood, the concept is togetherness, complementing daily life in Yoyogi Uehara. Based on Sichuan and Cantonese cuisines, the restaurant offers set meals like mapo tofu and boiled chicken during the day, and an à la carte menu in the evening. Like side dishes at home, the small dishes allow you to sample a variety of flavours. The whole crispy chicken is perfect for sharing. Friendly service makes for a pleasant experience.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/hibino-chukashokudo","short":"1-33-11 Uehara"},{"id":"1200569","name":"IL BALLOND'ORO","ja":"イル バロンドーロ","lat":35.646608,"lng":139.715464,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Italian","cuisineKo":"이탈리안","group":"유럽","price":"¥¥","addr":"1-24-10 Ebisu, Shibuya-ku","postal":"150-0013","tel":"+81 3-5422-8977","img":"https://prod-pics.guide.michelin.com/api/public/content/fa7739362c734e0abef2752d29947392.jpeg?format=jpeg&w=1000&h=1000","desc":"The walls are adorned with commemorative photographs and uniforms of Italian football players. The trattoria is named after the Ballon d'Or award presented to the top football players. The chef’s “Golden Risotto” glistens with the colour of saffron and is a testament to his past dreams of becoming a pro footballer. The menu is full of traditional dishes picked up from his travels throughout Italy from north to south.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/il-ballond-oro","short":"1-24-10 Ebisu"},{"id":"1193965","name":"jeeten","ja":"ジーテン","lat":35.670403,"lng":139.68257,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Chinese","cuisineKo":"중식","group":"중식","price":"¥¥","addr":"3-2-3 Nishihara, Shibuya-ku","postal":"151-0066","tel":"+81 3-3469-9333","img":"https://prod-pics.guide.michelin.com/api/public/content/5bb0fd5373924999aeacda111f031535.jpeg?format=jpeg&w=1000&h=1000","desc":"The billboard says ‘Chinese home cooking, Yoshida style’ and refers to nourishing Chinese food, based on yakuzen (medicinal food). Having experienced the healing power of Chinese cuisine, the owner-chef strives to devise dishes that restore bodily vigour. Helpful comments on the menu detail the effects of each, such as how mapo tofu stimulates the appetite, or sweet and sour pork with black vinegar relieves fatigue. The Beatles and other classics play in the background, making everyone feel at home.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/jeeten","short":"3-2-3 Nishihara"},{"id":"1196297","name":"Katsuo Shokudo","ja":"かつお食堂","lat":35.654087,"lng":139.702122,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Japanese","cuisineKo":"일식","group":"일식","price":"¥","addr":"B1F, 7-12 Uguisudanicho, Shibuya-ku","postal":"150-0032","tel":"+81 3-6877-5324","img":"https://prod-pics.guide.michelin.com/api/public/content/5607704a85f642b0b9371def8b53c87a.jpeg?format=jpeg&w=1000&h=1000","desc":"The eye is drawn to the shaver placed at the centre of the counter. The chef first encountered katsuobushi through the deliciousness of miso soup prepared by her grandmother. Overlaying her own image with that of her grandmother, she gently encloses the katsuobushi in both hands and shaves it with affection. Bonito is the star of the set menu: a main dish of grilled bonito, shaved bonito on rice, and miso soup made with bonito broth. The chef spreads the wonders of Japanese food culture while sharing the tales behind katsuobushi.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/katsuo-shokudo","short":"7-12 Uguisudanicho"},{"id":"1197753","name":"Kinoshita","ja":"キノシタ","lat":35.681813,"lng":139.69341,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"3-37-1 Yoyogi, Shibuya-ku","postal":"151-0053","tel":"+81 3-3376-5336","img":"https://prod-pics.guide.michelin.com/api/public/content/e9da3c1e678d450cad4f17b889865f1f.jpeg?format=jpeg&w=1000&h=1000","desc":"Prix fixe is the rule here, but with plenty of room for choice. Traditional fare includes favourites such as pâté de campagne, smoked salmon and roast lamb. Standard dishes are always on the menu, constantly being improved as the chef hones his skills with each dish. The chef prepares his creations in silence, the very picture of the craftsman, pouring his passion into simple French cuisine that brings out the native goodness of the ingredients.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/kinoshita-1197753","short":"3-37-1 Yoyogi"},{"id":"1201197","name":"Kuhara","ja":"久原","lat":35.65356,"lng":139.707711,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Japanese","cuisineKo":"일식","group":"일식","price":"¥¥","addr":"2-25-38 Higashi, Shibuya-ku","postal":"150-0011","tel":"+81 50-5596-3472","img":"https://prod-pics.guide.michelin.com/api/public/content/824dfeb883cf4412bba60d24528f23ec.jpg?format=jpeg&w=1000&h=1000","desc":"The friendly couple who run Kuhara—the chef a disciple of Japanese cuisine, the proprietress a welcoming figure in kappo wear—make us instantly feel at home. The signature fare is duck. In addition to salt-grilled duck, they offer chilled breast stew in summer, and a hot duck stew called jibuni in winter. Dried baby fish with soy and pepper on rice and Kokusho miso soup of root vegetables are must-try items. Unripe pepper is gathered by the couple and their children when they visit her hometown in Tochigi Prefecture. Kokusho miso soup brings back memories for the chef, who sampled it when he applied to a restaurant specialising in shojin ryori.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/koryori-kuhara","short":"2-25-38 Higashi"},{"id":"1212484","name":"le bistrot des bleus","ja":"ル ビストロ デ ブル","lat":35.650758,"lng":139.721829,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2F, EAT PLAY WORKS, 5-4-16 Hiro, Shibuya-ku","postal":"150-0012","tel":"+81 3-6447-7131","img":"https://prod-pics.guide.michelin.com/api/public/content/5ec8037a0dbf48ed8b4569ed63e642fe.jpg?format=jpeg&w=1000&h=1000","desc":"The ‘blue’ of this ‘bistro of the blues’ refers to the blue in the French flag, which represents liberty. The young chef and sommelier enthusiastically pour out their passion for French cuisine. Home cooking from throughout France, such as choucroute and bouillabaisse, are available à la carte. Doors open at 3pm. Its location in a narrow restaurant row and the casual atmosphere within capture the bistro’s spirit of freedom.<br>","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/le-bistrot-des-bleus","short":"5-4-16 Hiro"},{"id":"1194236","name":"Le cabaret","ja":"ル・キャバレ","lat":35.670097,"lng":139.685344,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"8-8 Motoyoyogicho, Shibuya-ku","postal":"151-0062","tel":"+81 3-3469-7466","img":"https://prod-pics.guide.michelin.com/api/public/content/4f642aa4b40d41389c91a76e47559362.jpeg?format=jpeg&w=1000&h=1000","desc":"A place to enjoy organic wine and bistro fare. The blackboard menu is filled with charcuterie such as salami and rillettes, a plentiful serving of crudités, and steak frites. Portions of this classic French cuisine are generous, perfect for sharing a plate. Signatures of wine growers who have visited the restaurant hang on the wall, telling a tale of ongoing exchange.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/le-cabaret-1194236","short":"8-8 Motoyoyogicho"},{"id":"1194254","name":"Los Reyes Magos","ja":"ロス レイエス マーゴス","lat":35.677867,"lng":139.692365,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Spanish","cuisineKo":"스페인","group":"유럽","price":"¥¥","addr":"5-55-7 Yoyogi, Shibuya-ku","postal":"151-0053","tel":"+81 3-3469-8231","img":"https://prod-pics.guide.michelin.com/api/public/content/2bf532a64524434ea5298a976798dd88.jpeg?format=jpeg&w=1000&h=1000","desc":"The second-generation chef passes on the Catalonian cuisine that the first-generation chef acquired in Barcelona. Salad of sardines and egg like grandma used to make honours the memory of this couple’s mentors. Dried cod and parsley sauce and homemade sausages convey the flavours of Catalonia, while the well-worn pots attest to the popularity of the paella. Cuisine interwoven with warm memories echoes the journey this restaurant has traced.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/los-reyes-magos","short":"5-55-7 Yoyogi"},{"id":"1241936","name":"Night Market","ja":"ナイトマーケット","lat":35.659725,"lng":139.708022,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"South East Asian","cuisineKo":"동남아","group":"아시아","price":"¥¥","addr":"2-6-6 Shibuya, Shibuya-ku","postal":"150-0002","tel":"+81 3-6433-5516","img":"https://prod-pics.guide.michelin.com/api/public/content/77f958f36ce24e1d86dac0c36b27ddcf.jpeg?format=jpeg&w=1000&h=1000","desc":"The very name of the restaurant builds excitement ahead of guest’s visit. The concept is a night market, which has roots in Southeast Asia. The chef, inspired by hawker cuisine experienced across multiple countries, interprets street-market dishes through Japanese ingredients. The menu is à la carte, the origin of each dish indicated by national flags. A visit here feels like a tour of the night markets of Vietnam, Thailand, Indonesia and Malaysia. Cuisines, cultures and people mingle in an exotic atmosphere.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/night-market-1241936","short":"2-6-6 Shibuya"},{"id":"1195439","name":"REI","ja":"レイ","lat":35.670208,"lng":139.684517,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Chinese","cuisineKo":"중식","group":"중식","price":"¥¥","addr":"10-8 Motoyoyogicho, Shibuya-ku","postal":"151-0062","tel":"+81 3-6416-8803","img":"https://prod-pics.guide.michelin.com/api/public/content/4b7e4388942445dc9839019b32cc1f28.jpeg?format=jpeg&w=1000&h=1000","desc":"The concept is ‘neo-machichuka’, ‘machichuka’ denoting an unpretentious neighbourhood Chinese restaurant and ‘neo’ referencing an upgrade for modern tastes. A culinary tune-up, so to speak, with the accent on changing aromas and textures. Red sea-bream salad, for example, is dressed with scorched rice for a smoky fragrance. Mouth-watering chicken, prepared in black vinegar to deepen the flavour, accentuates red pepper and nutty texture. Menu items are reassuringly familiar, yet each recipe harbours a novel twist.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/rei","short":"10-8 Motoyoyogicho"},{"id":"1212807","name":"Tachiguisushi Sushikawa","ja":"立食い鮨 鮨川","lat":35.67279,"lng":139.662367,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Sushi","cuisineKo":"스시","group":"일식","price":"¥¥","addr":"1-62-6 Sasazuka, Shibuya-ku","postal":"151-0073","tel":"+81 90-9260-3611","img":"https://prod-pics.guide.michelin.com/api/public/content/587a9bcd443d4a438f60d2350fff173c.jpeg?format=jpeg&w=1000&h=1000","desc":"Sushi got its start as hawker food that flourished in Edo (old Tokyo). To impart a feeling for that culture, Tachiguisushi Sushikawa is a standup sushi bar (and is what the name means). No drinking snacks; this is nigiri only, which you can order piece by piece according to your taste. Sushi toppings display an old-school craftsmanship. The chef harbours doubts about the recent trend of taking sushi up-market, which is why he recreated the atmosphere of a real-deal, no-nonsense sushi joint. A sushi local where regulars come to chat with the chef.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tachiguisushi-sushikawa","short":"1-62-6 Sasazuka"},{"id":"1194098","name":"Tonkatsu Nanaido","ja":"とんかつ 七井戸","lat":35.671805,"lng":139.713803,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"3-42-11 Jingumae, Shibuya-ku","postal":"150-0001","tel":"+81 80-8190-1331","img":"https://prod-pics.guide.michelin.com/api/public/content/925f1f06395d4dff9e0a5964738b36ee.jpeg?format=jpeg&w=1000&h=1000","desc":"As a child, the chef was sometimes given tonkatsu as a special treat. That happy memory inspired him to open this tonkatsu restaurant. Insisting on meat rich with flavour, he uses name-brand pork only. A combination of chunky breadcrumbs and frying in relatively cool lard results in crisp batter and meat that turns succulent. Rice is cooked in clay pots, then transferred to round wooden tubs, bringing out the rice’s sweetness while preserving its fluffy plumpness. As the chef of a yakitori shop as well, he takes special pride in his chicken cutlets.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tonkatsu-nanaido","short":"3-42-11 Jingumae"},{"id":"1208220","name":"Torishige","ja":"鳥茂","lat":35.687987,"lng":139.698876,"ward":"Shibuya-ku","wardKo":"시부야","cuisine":"Pork","cuisineKo":"돼지고기","group":"일식","price":"¥¥","addr":"2-6-5 Yoyogi, Shibuya-ku","postal":"151-0053","tel":"+81 3-3379-5188","img":"https://prod-pics.guide.michelin.com/api/public/content/6459c6062233435ab8ee98761013bede.jpeg?format=jpeg&w=1000&h=1000","desc":"This has been in operation since starting life as a food stall in the postwar years. An old photo on the first floor shows the original sign from those early days. The ‘Tori’ in Torishige reflects an earlier usage, when yakitori referred to pork as well as chicken skewers; ‘shige’ is in honour of the Prime Minister of that time, Shigeru Yoshida. In place of chopsticks, two bamboo skewers are used; meat-stuffed bell peppers are a tradition since the first generation. Beef was added by the second-generation chef; the use of rare cuts is an innovation by the current chef. In era after era, Torishige continues its success story.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/torishige","short":"2-6-5 Yoyogi"},{"id":"1194169","name":"Homemade Ramen Muginae","ja":"Homemade Ramen 麦苗","lat":35.590775,"lng":139.732803,"ward":"Shinagawa-ku","wardKo":"시나가와","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"6-11-10 Minamioi, Shinagawa-ku","postal":"140-0013","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/21a917c96e984fcebd7a07deb081f98a.jpeg?format=jpeg&w=1000&h=1000","desc":"One of the essential processes of wheat cultivation is treading the wheat. When the wheat plants bud, farmers tread them down so they grow up strong. The owner-chef named his shop Muginae, ‘wheat seedling’, as a prayer that it would grow as it overcame adversity, a hopeful shoot on the forest floor. Ramen, fragrant and homemade, has a smooth finish. Soup is seasoned with soy sauce, salt and dried sardines. Word has spread like wildfire, and now customers tread the streets of Minamioi from early morning for a cup of this restaurant’s delicious broth.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/h
