omemade-ramen-muginae","short":"6-11-10 Minamioi"},{"id":"1194189","name":"Mochibuta Tonkatsu Taiyo","ja":"もち豚とんかつ たいよう","lat":35.618815,"lng":139.706435,"ward":"Shinagawa-ku","wardKo":"시나가와","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"3-22-7 Koyama, Shinagawa-ku","postal":"142-0062","tel":"+81 3-3786-1464","img":"https://prod-pics.guide.michelin.com/api/public/content/95a4c492f3a1496aac1eb3a02c5fb52f.jpeg?format=jpeg&w=1000&h=1000","desc":"The shop takes such pride in the quality of its pork—Mochibuta, a domestic pork known for its tender meat and light, clean-flavoured fat—that the brand is in the name of the restaurant. Pork is deep-fried in vegetable oil, on a low flame at a leisurely pace, for a light texture. The chef is a study in undivided concentration as he hovers over his pots. Tonjiru pork soup is generously full of ingredients. The location is next to Musashikoyama Shopping Street, famed for its long arcade. Reservations are accepted for evenings. <br>","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/mochibuta-tonkatsu-taiyo","short":"3-22-7 Koyama"},{"id":"1194192","name":"Yakitori Abe","ja":"やきとり 阿部","lat":35.633996,"lng":139.718071,"ward":"Shinagawa-ku","wardKo":"시나가와","cuisine":"Yakitori","cuisineKo":"야키토리","group":"일식","price":"¥¥","addr":"3-3-4 Kamiosaki, Shinagawa-ku","postal":"141-0021","tel":"+81 3-5422-9834","img":"https://prod-pics.guide.michelin.com/api/public/content/da3b93e4574c4f3bad8892f2b003afdd.jpeg?format=jpeg&w=1000&h=1000","desc":"The omakase yakitori selections keep coming until you say ‘stop’. Tempo modulates in constant flux: flavours alternate from light to rich, and textures from firm to tender, punctuated with vegetables for variety. Sizes of pieces on skewers vary by cut of meat, accentuating the character of each. In a practice unique to Japan, the chef wears a headband fashioned from a twisted towel, his face a mask of concentration as he focuses on one skewer at a time. Putting his training of the next generation to good use, the chef runs a disciplined kitchen team.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/yakitori-abe","short":"3-3-4 Kamiosaki"},{"id":"1193918","name":"Kyorakutei","ja":"蕎楽亭","lat":35.700778,"lng":139.739514,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"3-6 Kagurazaka, Shinjuku-ku","postal":"162-0825","tel":"+81 3-3269-3233","img":"https://prod-pics.guide.michelin.com/api/public/content/f67dc31131894685a7ca41d54a8922ea.jpeg?format=jpeg&w=1000&h=1000","desc":"The queue forms before the doors open. The reason for Kyorakutei’s popularity is the extensive menu, with drinks and snacks to sample between bites of soba. It’s great to visit any time, whether day or evening. Tempura choices are also abundant, and guests can order combination platters or individual items according to preference. Buckwheat is sourced from the chef’s native Aizu, with a focus on delivering the flavour of cold inaka soba (thick soba made with whole buckwheat) with a pleasing finish. Tomato soba, the early summer speciality, is worth waiting for.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/kyorakutei","short":"3-6 Kagurazaka"},{"id":"1194223","name":"L'AMITIE","ja":"ラミティエ","lat":35.712099,"lng":139.707969,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"2-9-12 Takadanobaba, Shinjuku-ku","postal":"169-0075","tel":"+81 3-5272-5010","img":"https://prod-pics.guide.michelin.com/api/public/content/f3f7130cfff84461880ae07024ca15ab.jpeg?format=jpeg&w=1000&h=1000","desc":"Apprenticing at a bistro in Paris, the chef was captivated by its lively energy. At L'AMITIE, he has put down roots in Takadanobaba with this intimate diner where you can feel like part of the daily life of France. Offerings include meat terrine À la campagne, cassoulet and beef cheek simmered in red wine. À la carte items are prepared for two, so you can enjoy sharing. Savour Gallic culinary culture and the ambience of the French countryside.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/l-amitie-1194223","short":"2-9-12 Takadanobaba"},{"id":"1218245","name":"Loiseau de France","ja":"ロワゾー・ドゥ・フランス","lat":35.697974,"lng":139.740054,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"15 Ichigayafunagawaramachi, Shinjuku-ku","postal":"162-0826","tel":"+81 3-6280-7803","img":"https://prod-pics.guide.michelin.com/api/public/content/d14215ad3564491190ba139c7a7debe2.jpeg?format=jpeg&w=1000&h=1000","desc":"Inside Institut Français de Tokyo, time flows slowly, the bustle of the city forgotten. The chalk-white building, designed to suggest a small village in the south of France, gently enfolds a courtyard. Poached eggs in red wine sauce and beef simmered in red wine bring a taste of Saulieu, in Burgundy’s Côte d’Or. Desserts are classic sweets selected from a trolley, as tradition dictates.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/loiseau-de-france","short":"15 Ichigayafunagawaramachi"},{"id":"1194184","name":"Meishan","ja":"梅香","lat":35.701196,"lng":139.73633,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Chinese","cuisineKo":"중식","group":"중식","price":"¥¥","addr":"37-39 Yokoteramachi, Shinjuku-ku","postal":"162-0831","tel":"+81 3-3260-2658","img":"https://prod-pics.guide.michelin.com/api/public/content/139543adc550444581b38266ea629712.jpeg?format=jpeg&w=1000&h=1000","desc":"Two sisters run this Sichuan restaurant, the elder tending flame and wok in the kitchen, the younger serving guests plates of steaming fare. Stir-fried vegetables, served with pickled vegetables and fermented tofu, are home-style favourites. Steamed chicken and mapo tofu use spices to bring out the flavours of the ingredients. Framed Chinese paper-cutout art adorns the walls; the music of the erhu sets the mood. The reverence for Chinese culture and food is unmistakable.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/meishan","short":"37-39 Yokoteramachi"},{"id":"1213188","name":"RAMEN MATSUI","ja":"ラーメン マツイ","lat":35.689095,"lng":139.715487,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"4-25-10 Yotsuya, Shinjuku-ku","postal":"160-0004","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/88c8f250f55a442aaa38f66e447c5c8b.jpeg?format=jpeg&w=1000&h=1000","desc":"The husband boils the noodles; the wife garnishes them with spring onion and fermented bamboo shoots. Between them, they bring alpha and omega together to complete each bowl of ramen. Flavours are based on soy sauce, salt and dried sardines. To bring out the aroma, pure rice sake is added to chicken or seafood dashi soup stock. Several types of fragrant oil are used, deepening the flavour experience. Kombu kelp, scallops and wheat flour, all from Hokkaido, infuse the husband’s love of his homeland.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ramen-matsui","short":"4-25-10 Yotsuya"},{"id":"1219188","name":"Shinrakuki","ja":"新楽記","lat":35.685578,"lng":139.723891,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Chinese","cuisineKo":"중식","group":"중식","price":"¥¥","addr":"2-7 Wakaba, Shinjuku-ku","postal":"160-0011","tel":"+81 3-6380-0423","img":"https://prod-pics.guide.michelin.com/api/public/content/ceb9857caf4148cc942f148c23dad432.jpg?format=jpeg&w=1000&h=1000","desc":"‘Hong Kong cuisine and organic wine’ sums up the concept. We recommend ordering Cantonese flame-broiled items to start. Meat is suspended over an open hearth for patient roasting. On the grill, meat is skewered or hung from special hooks and cooked over direct flame. Pork cuts and duck are sweetened with honey or malt sugar and seasoned with soy sauce or Chinese five-spice powder, which condense the umami as the meat broils. The steamed whole grouper and the pigeon pickled in tamari soy sauce are offered by advance reservation only.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/shinrakuki","short":"2-7 Wakaba"},{"id":"1217146","name":"Shokudo Wata","ja":"食堂わた","lat":35.689798,"lng":139.713012,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Izakaya","cuisineKo":"이자카야","group":"일식","price":"¥¥","addr":"1-19-11 Shinjuku, Shinjuku-ku","postal":"160-0022","tel":"+81 3-6822-7907","img":"https://prod-pics.guide.michelin.com/api/public/content/c84a44a213d343ec80187e40b6f6e1db.jpg?format=jpeg&w=1000&h=1000","desc":"Putting to work his experience studying authentic Japanese cuisine, the chef opened this restaurant as an izakaya where people will drop in as part of their daily lives. A warm and gentle light spreads through the restaurant and into the street through wood-framed windows. Conceived to be enjoyed casually, the flavours in the simple fare are deep and complex. In the unassuming interior, one dish follows another, each prepared with painstaking attention to detail. Maybe this is the meaning of luxury within the everyday.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/shokudo-wata","short":"1-19-11 Shinjuku"},{"id":"1194027","name":"Soba Osame","ja":"蕎麦 おさめ","lat":35.722628,"lng":139.701032,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥¥","addr":"3-21-5 Shimochiai, Shinjuku-ku","postal":"161-0033","tel":"+81 3-6908-2362","img":"https://prod-pics.guide.michelin.com/api/public/content/6aea478ab57b4f298c98d12232e5703a.jpeg?format=jpeg&w=1000&h=1000","desc":"With close cooperation with food producers as his creed, the chef devotes himself to his 100% buckwheat juwari soba. He only uses ingredients native to Japan, to convey the charm of old-school soba. Depending where his ingredients come from, his soba may be served on a wickerwork tray, and may be either coarse-ground or ground with husks included. His inquiring mind drives him to check each day’s soba, adjusting thickness and serving temperature according to its nature. His diligent application is raising soba to new levels, as his many regulars would agree.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/soba-osame","short":"3-21-5 Shimochiai"},{"id":"1194005","name":"Sushidokoro Shigeru","ja":"すし処 志げる","lat":35.691759,"lng":139.721697,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Sushi","cuisineKo":"스시","group":"일식","price":"¥¥","addr":"15 Funamachi, Shinjuku-ku","postal":"160-0006","tel":"+81 3-3226-1588","img":"https://prod-pics.guide.michelin.com/api/public/content/b72c400d0aab4def8381a8578d747d3f.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef chose to hang his noren in his native Shinjuku out of his passion to offer ‘a sushi restaurant for the masses’, where guests can enjoy themselves in a casual atmosphere. For many diners, the draw is the omakase set menus. Putting to work his experience across various genres of Japanese cuisine, the chef begins the meal with steamed items, followed by grilled and simmered dishes. As he prepares nigiri sushi, the chef’s knife work is quick, practiced and sure. ‘Torotaku’, a dish of beaten tuna and pickled daikon, is a perennial favourite. The customer-oriented use of high-quality food at reasonable prices is welcome.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sushidokoro-shigeru","short":"15 Funamachi"},{"id":"1194101","name":"Tonkatsu Hinata","ja":"とんかつ ひなた","lat":35.712956,"lng":139.707493,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"2-13-9 Takadanobaba, Shinjuku-ku","postal":"169-0075","tel":"+81 3-6380-2424","img":"https://prod-pics.guide.michelin.com/api/public/content/4ec0ab648f49445ead3daf0274133609.jpeg?format=jpeg&w=1000&h=1000","desc":"Tonkatsu Hinata sources pork from two prestigious brands with different flavour profiles. Both are selected for the sweetness of their fat, tender meat, pleasantly firm texture, and abundant flavour. The shop buys pig carcasses whole, so it can offer a wide variety of cuts, including not only loin and tenderloin but also prime rib and rump. Order the evening prix fixe meal and you’ll enjoy the privilege of tasting rarer cuts— rump cap, pork jowl and eye-of-round— fried one after another.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tonkatsu-hinata","short":"2-13-9 Takadanobaba"},{"id":"1206656","name":"Yakitori SANKA","ja":"焼鳥 山香","lat":35.703438,"lng":139.732869,"ward":"Shinjuku-ku","wardKo":"신주쿠","cuisine":"Yakitori","cuisineKo":"야키토리","group":"일식","price":"¥¥","addr":"2F, 64-4 Yaraicho, Shinjuku-ku","postal":"162-0805","tel":"+81 3-6265-0108","img":"https://prod-pics.guide.michelin.com/api/public/content/c18419dc3e924c7a84d234ad9e6b035d.jpeg?format=jpeg&w=1000&h=1000","desc":"A former hairdresser, the chef puts his skills with scissors to good use. Chicken for yakitori is cut along the fibres, making skewers that are pleasing to the eye. Salt is applied with the precision of a hairstylist, creating a symphony of flavours that feels meticulously crafted. While favouring chicken from Kochi Prefecture, the chef chooses the producing region according to the cut. Skill and beauty, fused in yakitori—be sure to give it a try.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/yakitori-sanka","short":"64-4 Yaraicho"},{"id":"1201689","name":"Sasaki Seimenjo","ja":"佐々木製麺所","lat":35.708552,"lng":139.592358,"ward":"Suginami-ku","wardKo":"스기나미","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"4-26-10 Nishiogikita, Suginami-ku","postal":"167-0042","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/3a0bf52ff7a24763a3604dabfea0c3c0.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef ’s aim is to create a ramen shop beloved by locals. He sources ingredients from greengrocers and butchers in Nishiogi, treasuring his interactions with local people. The distance from the train station is also a blessing, as neighbourhood schoolchildren and their families can be seen sitting shoulder-to-shoulder, happily slurping noodles. As befits the ‘Seimenjo’, or ‘noodle-maker’, in the name, his use of Japanese wheat is a selling point. In addition to standard thin noodles, he also offers flat noodles. The miso flavour is a much-anticipated treat in autumn and winter.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sasaki-seimenjo","short":"4-26-10 Nishiogikita"},{"id":"1194024","name":"Sennomago","ja":"仙ノ孫","lat":35.706387,"lng":139.595811,"ward":"Suginami-ku","wardKo":"스기나미","cuisine":"Chinese","cuisineKo":"중식","group":"중식","price":"¥¥","addr":"4-4-2 Nishiogikita, Suginami-ku","postal":"167-0042","tel":"+81 3-3390-4808","img":"https://prod-pics.guide.michelin.com/api/public/content/1787185d395147e9b736c7547edc5a98.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef devotes himself to good health through a balanced diet, using Chinese medicines as seasoning to serve food that is salutary for both mind and body. Vegetables from his native Oita are grown by natural methods, making them gentle to the constitution. At dinner, there is a wide range of à la carte dishes, leaning toward Sichuan and Shanghai influences. The chef allows himself an individual take with the mapo tofu: drawing on a wealth of experience, he offers a choice of Sichuan, aged doubanjiang (Chinese broad bean chili paste) and salt. Lunchtime set menus are also popular.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sennomago","short":"4-4-2 Nishiogikita"},{"id":"1214706","name":"Shiosoba Jiku","ja":"塩そば 時空","lat":35.689738,"lng":139.618974,"ward":"Suginami-ku","wardKo":"스기나미","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"4-14-7 Takaidohigashi, Suginami-ku","postal":"168-0072","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/3ce6f2219dbe46ea8926650e25e53d4f.jpeg?format=jpeg&w=1000&h=1000","desc":"The chef heard the call to the culinary life one day while riding his father’s motorcycle on a long tour around the Seto Inland Sea. When he happened upon a ramen shop along the way, the taste of the salty soba touched his soul. He combines a clear seafood broth with homemade noodles crafted with aroma in mind. The ceiling decoration recalls the roof of an old-time food stall, honouring how ramen culture spread in his native Hiroshima Prefecture.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/shiosoba-jiku","short":"4-14-7 Takaidohigashi"},{"id":"1206217","name":"Tensuke","ja":"天すけ","lat":35.705867,"lng":139.64872,"ward":"Suginami-ku","wardKo":"스기나미","cuisine":"Tempura","cuisineKo":"텐푸라","group":"일식","price":"¥","addr":"3-22-7 Koenjikita, Suginami-ku","postal":"166-0002","tel":"+81 3-3223-8505","img":"https://prod-pics.guide.michelin.com/api/public/content/f5f551fc4ae74f26ad6e191745629800.jpeg?format=jpeg&w=1000&h=1000","desc":"The lines that form outside Tensuke at lunchtime are a part of the Koenji landscape. Inside, one voice after another calls for the ‘Egg Lunch’. Accompanying the speciality of deep-fried egg on rice, tempura items are fried in a set order. Another speciality is the performance of the chef, who tosses the eggshells in the air in poses worthy of a kabuki actor. The idea is to make the waiting time fun, too. Deep-fried eggs fill mouths with yolk and smiles.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tensuke","short":"3-22-7 Koenjikita"},{"id":"1206441","name":"there is ramen","ja":"ゼアー イズ ラーメン","lat":35.70737,"lng":139.618381,"ward":"Suginami-ku","wardKo":"스기나미","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"3-10-16 Amanuma, Suginami-ku","postal":"167-0032","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/99030953a3c04091b345fa6f1b655608.jpeg?format=jpeg&w=1000&h=1000","desc":"The soup accentuates the umami of the meats with the flavour of dried sardines; if you’re looking for soup with a unique and beguiling taste, you’ve found it here. Chashumen, ramen topped with roasted pork, is so covered in pork slices that they hide the noodles. Rice is available as an extra with the ramen, so try placing some of the roasted pork on top of it to make chashudon, roast-pork rice. Impressive and satisfying indeed, as if to say there is ramen here.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/there-is-ramen","short":"3-10-16 Amanuma"},{"id":"1193873","name":"Edosoba Hosokawa","ja":"江戸蕎麦 ほそ川","lat":35.696701,"lng":139.798036,"ward":"Sumida-ku","wardKo":"스미다","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥","addr":"1-6-5 Kamezawa, Sumida-ku","postal":"130-0014","tel":"+81 3-3626-1125","img":"https://prod-pics.guide.michelin.com/api/public/content/6c256e3d6584422b9215562358607951.jpeg?format=jpeg&w=1000&h=1000","desc":"An old-school soba shop founded by a Katsushika-born chef. With ‘good food requires good ingredients’ as his credo, he scours Japan end-to-end to find the highest-quality buckwheat, vegetables and seafood. Among his à la carte offerings, he takes pride in temptations such as conger eel, either fried as tempura or simmered. Juwari soba, handmade from raw buckwheat flour, is fine and silky smooth. Everything here, from the crockery to the food to the interior, oozes old-time soba-shop charm. Amidst the old Edo ambience of Ryogoku, a food culture of deep roots and subtle traditions lives on.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/edosoba-hosokawa","short":"1-6-5 Kamezawa"},{"id":"1218218","name":"Shutei Tanaka","ja":"酒亭 田中","lat":35.731387,"lng":139.819549,"ward":"Sumida-ku","wardKo":"스미다","cuisine":"Yakitori","cuisineKo":"야키토리","group":"일식","price":"¥¥","addr":"3-25-7 Sumida, Sumida-ku","postal":"131-0031","tel":"+81 3-3617-6615","img":"https://prod-pics.guide.michelin.com/api/public/content/590343fbb1174de1b12466c60569d670.jpeg?format=jpeg&w=1000&h=1000","desc":"A competitive performance in yakitori run by two brothers, both hailing from other disciplines of Japanese cuisine. Dinner is served prix fixe, with the brothers taking turns serving. Chicken skewers are mainly served salted, keeping the focus on the flavour of the locally raised chicken. As the name ‘Shutei’, meaning something like pub, suggests, the neatly cut snacks and yakitori keep the sake going down smoothly. A number of choices are available for the final dish. Enjoy the ‘baton relay’ of the oyakodon, with the younger brother grilling the chicken and the elder brother wrapping it in egg.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/shutei-tanaka","short":"3-25-7 Sumida"},{"id":"1240865","name":"Sobakappo Nagano","ja":"蕎麦割烹 ながの","lat":35.719268,"lng":139.814993,"ward":"Sumida-ku","wardKo":"스미다","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥¥","addr":"2-20-6 Higashimukojima, Sumida-ku","postal":"131-0032","tel":"+81 3-6675-0167","img":"https://prod-pics.guide.michelin.com/api/public/content/3b64edc4069142979a663afb76b61064.jpeg?format=jpeg&w=1000&h=1000","desc":"The name ‘Sobakappo’ encapsulates the chef’s career. He draws on his experience in Japanese cuisine to patiently craft stews and salads of cooked vegetables. Combination platters feature an impressive variety of small dishes designed to complement sake, including simmered herring in sweet soy sauce and marinated grilled shrimp. Soba comes in two varieties: seiro soba served on a wickerwork tray or coarse-ground soba. Noodles are made differently according to terroir, accentuating differences in flavour. A soba apprenticeship: laughing, struggling and loving with soba.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sobakappo-nagano","short":"2-20-6 Higashimukojima"},{"id":"1199822","name":"Asakusa Hirayama","ja":"浅草 ひら山","lat":35.710706,"lng":139.789854,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Soba","cuisineKo":"소바","group":"면","price":"¥¥","addr":"1-3-14 Nishiasakusa, Taito-ku","postal":"111-0035","tel":"+81 3-5830-6857","img":"https://prod-pics.guide.michelin.com/api/public/content/c660ed6736014ea290a24432e06cc17e.jpeg?format=jpeg&w=1000&h=1000","desc":"Asakusa Hirayama hangs out its shop curtain near Kappabashi; the calligraphy is done by the chef’s grandmother, a calligraphy teacher, expressing her joy in her grandson becoming an independent restaurateur. The counter seating harks back to his background as a kappo cook and his cheerful demeanour makes guests feel welcome. Soba is preceded by standards like jellied broth of conger eel or stew of duck breast. Tempura items are deep-fried one by one, as good as you’d find in a tempura specialty shop. The 100% buckwheat soba noodles, prepared with homemade flour made with unpolished buckwheat, are richly flavoursome.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/asakusa-hirayama","short":"1-3-14 Nishiasakusa"},{"id":"1207930","name":"grill GRAND","ja":"グリル グランド","lat":35.716956,"lng":139.797534,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Yoshoku","cuisineKo":"요쇼쿠","group":"일식","price":"¥","addr":"3-24-6 Asakusa, Taito-ku","postal":"111-0032","tel":"+81 3-3874-2351","img":"https://prod-pics.guide.michelin.com/api/public/content/93a089cccf31410382579ede54dc65e1.jpeg?format=jpeg&w=1000&h=1000","desc":"Beloved in Asakusa for three generations, this yoshoku restaurant treats demi-glace sauce as the soul of its kitchen. The most popular dish here is beef stew. Omurice is served with a choice of demi-glace or ketchup, a nod to the legacy shared between the former chef and his guests. The restaurant’s logo, a medieval-style shield adorned with the French tricolour, was inspired by a gift from a regular — a gesture that speaks to the warmth and goodwill of Tokyo’s traditional neighbourhoods.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/grill-grand","short":"3-24-6 Asakusa"},{"id":"1195724","name":"Hatsuogawa","ja":"初小川","lat":35.709758,"lng":139.794528,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Unagi / Freshwater Eel","cuisineKo":"장어","group":"일식","price":"¥¥","addr":"2-8-4 Kaminarimon, Taito-ku","postal":"111-0034","tel":"+81 3-3844-2723","img":"https://prod-pics.guide.michelin.com/api/public/content/b2664c8a3cc4433bbe3b721a778a3974.jpeg?format=jpeg&w=1000&h=1000","desc":"A veteran eel shop loved by Asakusa locals since the early years of the 20th century. The restaurant is named after the previous proprietor, Hatsutaro; by happy coincidence, ‘ogawa’ means ‘little river’, the favoured habitat of eels. The current proprietor’s wife runs the restaurant with her family, preparing kabayaki with a sauce recipe handed down from the founder. It is a pleasure to wait, enjoying appetizers with sake, while the chef grills your eel. The many ‘senjafuda’, slips of paper posted on shrine pillars by worshippers, attest to the shop’s many loyal customers.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/hatsuogawa","short":"2-8-4 Kaminarimon"},{"id":"1194122","name":"noura","ja":"ノウラ","lat":35.718455,"lng":139.797106,"ward":"Taito-ku","wardKo":"다이토","cuisine":"French","cuisineKo":"프렌치","group":"유럽","price":"¥¥","addr":"4-10-6 Asakusa, Taito-ku","postal":"111-0032","tel":"+81 3-6458-1255","img":"https://prod-pics.guide.michelin.com/api/public/content/ccf11c69330e42b391dee828e760934a.jpeg?format=jpeg&w=1000&h=1000","desc":"The name means ‘behind’, as in ‘behind the MICHELIN two-star restaurant out front’. In contrast to HOMMAGE, the purveyor of creative cuisine, noura is a homelike bistro that sticks to the basics. French onion soup, fish quenelle and duck confit are some of the French regional dishes on offer. Steak frîtes, a French comfort food, are a crowd-pleaser. This is French food culture for everyday life.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/noura","short":"4-10-6 Asakusa"},{"id":"1193888","name":"Onigiri Asakusa Yadoroku","ja":"おにぎり 浅草 宿六","lat":35.716906,"lng":139.794753,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Onigiri","cuisineKo":"오니기리","group":"일식","price":"¥","addr":"3-9-10 Asakusa, Taito-ku","postal":"111-0032","tel":"+81 3-3874-1615","img":"https://prod-pics.guide.michelin.com/api/public/content/82092126bb09481fb7315b02580ea430.jpeg?format=jpeg&w=1000&h=1000","desc":"This family has been serving onigiri in Asakusa for three generations. Ingredients are arrayed inside a glass case, as at a sushi shop, to be formed into onigiri on the spot. Offerings range from salmon and dried plum to rarer items such as herring roe pickled in sake lees and opossum shrimp preserved and simmered in sweetened soy sauce. Offering a wide range of ingredients allows customers to choose based on their physical condition; the area was once home to numerous bars and pubs, so customers would drop in for morsels to soothe constitutions punished by a night on the town.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/onigiri-asakusa-yadoroku","short":"3-9-10 Asakusa"},{"id":"1194171","name":"Ponta Honke","ja":"ぽん多 本家","lat":35.70631,"lng":139.773007,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Yoshoku","cuisineKo":"요쇼쿠","group":"일식","price":"¥¥","addr":"3-23-3 Ueno, Taito-ku","postal":"110-0005","tel":"+81 3-3831-2351","img":"https://prod-pics.guide.michelin.com/api/public/content/2b06a089f115451381cf0f347b1c42d0.jpeg?format=jpeg&w=1000&h=1000","desc":"Since its inception in 1905, this Western restaurant has been run by four generations of the same family. The chef’s famous cutlet is deep-fried in lard carefully trimmed from the pork he will fry. Everything is done by hand, as it has been from the first generation. The youthful energy and practiced skill of the chef is evident in every detail, even down to the hand-chopped cabbage. Traditional flavours and skills testify to his mettle. Delicious fare and the gentle ambience of a family enterprise make everyone feel at home.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/ponta-honke","short":"3-23-3 Ueno"},{"id":"1193993","name":"Sugita","ja":"すぎ田","lat":35.706397,"lng":139.79104,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"3-8-3 Kotobuki, Taito-ku","postal":"111-0042","tel":"+81 3-3844-5529","img":"https://prod-pics.guide.michelin.com/api/public/content/008a0850789e45bf8e4e402d7e20de0c.jpeg?format=jpeg&w=1000&h=1000","desc":"‘Tonkatsu is food for the masses’, explains the second-generation chef, as he aims to serve up fare that is familiar and comforting. Copper pots polished till gleaming and plain wooden counters display a craftsman’s spirit. Two pots are used: one containing hot oil and the other cooler oil. Pork loin is shorn of extra fat and thinly battered. Tonkatsu is the star attraction, so no meat is added to the pork miso soup. As the chef works, a photo of his father in chef’s whites watches over him.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sugita","short":"3-8-3 Kotobuki"},{"id":"1194103","name":"Tompachitei","ja":"とん八亭","lat":35.708414,"lng":139.773726,"ward":"Taito-ku","wardKo":"다이토","cuisine":"Tonkatsu","cuisineKo":"돈카츠","group":"일식","price":"¥","addr":"4-3-4 Ueno, Taito-ku","postal":"110-0005","tel":"+81 3-3831-4209","img":"https://prod-pics.guide.michelin.com/api/public/content/5bd6e8c7bced4e95b95e3a22e1971f17.jpeg?format=jpeg&w=1000&h=1000","desc":"This popular spot lies in a back-alley near Ameya-Yokocho. Defending the restaurant’s noren is its third-generation chef, who grew up in this part of Ueno but sharpened his skills in Europe. Tonkatsu here is primarily pork loin cutlets. Applying his knowledge of Western techniques, the chef fries thick cuts of pork in relatively cool lard over a gentle flame. With rock salt, Worcestershire sauce, tonkatsu sauce and soy sauce on offer, it’s fun to compare how each tastes. Be prepared to queue first.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/tompachitei","short":"4-3-4 Ueno"},{"id":"1210211","name":"Japanese Ramen Gokan","ja":"Japanese Ramen 五感","lat":35.732982,"lng":139.717911,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"2-57-2 Higashiikebukuro, Toshima-ku","postal":"170-0013","tel":"","img":"https://prod-pics.guide.michelin.com/api/public/content/7e4ede975a204c11a782e5241c766c20.jpeg?format=jpeg&w=1000&h=1000","desc":"The food looks great, the aroma whets the appetite, the flavour captivates: this ramen sets all five senses tingling. The word ‘Japanese’ in the shop’s name indicates that this is authentic Japan-made ramen; the name is written in Latin script to proclaim Japan’s comfort food to the world. Flavours of each region come together in a single bowl: salt ramen with shijimi and hamaguri clams; soy-sauce ramen with free-range chicken and kombu. Ceramic bowls handmade by a potter are used instead of porcelain. From ingredients to dining ware, the shop revisits the bounty and wonder of Japanese food culture.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/japanese-ramen-gokan","short":"2-57-2 Higashiikebukuro"},{"id":"1195722","name":"Katchar Batchar","ja":"カッチャル バッチャル","lat":35.727287,"lng":139.729481,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Indian","cuisineKo":"인도","group":"아시아","price":"¥","addr":"2F, 3-2-10 Minamiotsuka, Toshima-ku","postal":"170-0005","tel":"+81 3-5954-5551","img":"https://prod-pics.guide.michelin.com/api/public/content/ffadf740a7dc4c0b849faccbc599c3d4.jpeg?format=jpeg&w=1000&h=1000","desc":"From the north, butter chicken; from the west, pork vindaloo; shrimp curry from the south – such a lineup of flavours from every region of India adds breadth to the joy that is Indian cooking. Tandoori chicken and vegetables are cooked using the radiant heat of a tandoor. For spices, the basic triad is cumin, coriander and turmeric. To keep the flavours of meats and vegetables at the fore, the number of spices is kept to a minimum.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/katchar-batchar","short":"3-2-10 Minamiotsuka"},{"id":"1194176","name":"Matsunozushi","ja":"松野寿し","lat":35.726117,"lng":139.690794,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Sushi","cuisineKo":"스시","group":"일식","price":"¥¥","addr":"2-16-12 Minaminagasaki, Toshima-ku","postal":"171-0052","tel":"+81 3-3951-3588","img":"https://prod-pics.guide.michelin.com/api/public/content/ba962abc33a642ed959116f000a1c264.jpeg?format=jpeg&w=1000&h=1000","desc":"Sushi items lined up inside a glass display case ooze Showa-era ambience. A sushi shop of the old school, and that’s how the chef likes it. Cutting and serving the sushi himself, the chef offers everything from omakase set menus to à la carte. Tuna is marinated in soy sauce; conger eel is coated in a thick, sweet eel sauce; and egg is served ‘kurakake’ or ‘saddle-style’: layered into a cake and split over a bite-sized mound of vinegared rice. The character for ‘sushi’ combines the characters for ‘fish’ and ‘delicious’. The pursuit of essential Edo style expresses the chef’s pride in his craft better than any words.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/matsunozushi","short":"2-16-12 Minaminagasaki"},{"id":"1194186","name":"Mejiro Shunkotei","ja":"目白 旬香亭","lat":35.721514,"lng":139.70736,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Yoshoku","cuisineKo":"요쇼쿠","group":"일식","price":"¥¥","addr":"2F, Trad Mejiro, 2-39-1 Mejiro, Toshima-ku","postal":"171-0031","tel":"+81 3-5927-1606","img":"https://prod-pics.guide.michelin.com/api/public/content/ca30ceba2a664638b6738939ef6d2f38.jpeg?format=jpeg&w=1000&h=1000","desc":"‘Novel yet nostalgic Western food’ is the theme here. Hamburger steaks with dollops of demi-glace sauce and gratin dressed in silky smooth béchamel sauce are prepared in time-honoured ways, bringing back the flavours of the good old days. Decompression-prepared salad offers rich flavours and uniquely fresh textures. Unchanging methods combine with advanced cooking techniques declare a new approach to Western favourites.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/mejiro-shunkotei","short":"2-39-1 Mejiro"},{"id":"1195643","name":"Mejiro Zorome","ja":"目白 ぞろ芽","lat":35.721552,"lng":139.706358,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Unagi / Freshwater Eel","cuisineKo":"장어","group":"일식","price":"¥¥","addr":"B1F, 3-3-1 Mejiro, Toshima-ku","postal":"171-0031","tel":"+81 3-6908-3653","img":"https://prod-pics.guide.michelin.com/api/public/content/87fa0c56be5b44ac8a5575eb2dab115b.jpeg?format=jpeg&w=1000&h=1000","desc":"Unagi are dressed, skewered and grilled over high-grade charcoal. From the counter seats, the whole series of cooking scenes can be observed. The unagi are kept alive in purifying tanks until they are dressed, then dipped three times in sauce and grilled Edo-style. Sauce is used sparingly, letting the flavour of the fish speak for itself. Rice cooked somewhat firm, and freshly ground sansho pepper deliver a distinctive touch. Skilful restraint shows in the short steaming time and sparing use of sauce.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/mejiro-zorome","short":"3-3-1 Mejiro"},{"id":"1194119","name":"Negima","ja":"ねぎま","lat":35.734057,"lng":139.729926,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Japanese","cuisineKo":"일식","group":"일식","price":"¥¥","addr":"B1F, 2-31-19 Kitaotsuka, Toshima-ku","postal":"170-0004","tel":"+81 80-8739-8566","img":"https://prod-pics.guide.michelin.com/api/public/content/05a213b864da43b0987c3a97e5474d37.jpeg?format=jpeg&w=1000&h=1000","desc":"Negima-nabe, a tuna and spring onion stew, is a tradition handed down since the days of the shoguns. At a time when lean meat was treasured, this stew was contrived as a way of lightening the texture of toro, the fatty cut of tuna. Enchanted with Edo-era cooking, the proprietress of Negima revived it. True to original recipes, the dish uses neither kombu nor mirin. The meal ends with ‘pepper rice’, a dish of fresh-cooked rice seasoned with broth from the pot and pepper. Sample the pure cooking that true Edo-ites have always loved.","year":"2026","booking":true,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/negima","short":"2-31-19 Kitaotsuka"},{"id":"1194026","name":"Sosakumenkobo NAKIRYU","ja":"創作麺工房 鳴龍","lat":35.728677,"lng":139.730345,"ward":"Toshima-ku","wardKo":"도시마","cuisine":"Ramen","cuisineKo":"라멘","group":"면","price":"¥","addr":"2-34-4 Minamiotsuka, Toshima-ku","postal":"170-0005","tel":"+81 3-6304-1811","img":"https://prod-pics.guide.michelin.com/api/public/content/17d922103c50449fa11f5fe90959e623.jpeg?format=jpeg&w=1000&h=1000","desc":"‘Nakiryu’ means ‘roaring dragon’. The name is rich with meaning: it’s a reference to the dragon of Yakushido Hall in the Nikko Toshogu Shrine, to hopes for business growth, and to the couple who craft bowls of ramen together in perfect sync, both born in the Year of the Dragon. Dandan noodles create a synergy of flavours—layering meat miso, Chinese sesame paste, and chilli oil for a deep, amplified umami. Soy-sauce ramen owes its elegant flavour to its soup, drawn from whole chicken and oysters. À la carte items such as steamed chicken with spicy sauce and shrimp wontons exemplify experience with Chinese cuisine.","year":"2026","booking":false,"url":"https://guide.michelin.com/en/tokyo-region/tokyo/restaurant/sosakumenkobo-nakiryu","short":"2-34-4 Minamiotsuka"}]</script>

L.control.attribution({position: window.matchMedia('(max-width:820px)').matches ? 'topleft' : 'bottomright', prefix:false}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OSM &copy; CARTO · MICHELIN Guide 2026', subdomains:'abcd', maxZoom:19
}).addTo(map);

function pinIcon(r, big){
  var s = big ? 17 : (MOBILE() ? 13 : 11);
  return L.divIcon({className:'', iconSize:[s,s], iconAnchor:[s/2,s/2],
    html:'<div class="pin'+(big?' big':'')+'" style="width:'+s+'px;height:'+s+'px;background:'+COLOR[r.group]+'"></div>'});
}

var layer;
if (typeof L.markerClusterGroup === 'function') {
  layer = L.markerClusterGroup({
    maxClusterRadius:24, disableClusteringAtZoom:14, spiderfyOnMaxZoom:true,
    showCoverageOnHover:false, chunkedLoading:true,
    iconCreateFunction:function(c){
      var cnt={}, ms=c.getAllChildMarkers();
      ms.forEach(function(m){ var g=m.options.__g; cnt[g]=(cnt[g]||0)+1; });
      var top=null,best=-1;
      Object.keys(cnt).forEach(function(k){ if(cnt[k]>best){best=cnt[k];top=k;} });
      var col=COLOR[top]||'#d4af37', n=ms.length, d=(n<5?28:(n<10?32:36));
      return L.divIcon({className:'', iconSize:[d,d],
        html:'<div style="width:'+d+'px;height:'+d+'px;border-radius:50%;background:'+col+';'
           + 'box-shadow:0 0 0 4px '+col+'33,0 2px 8px rgba(0,0,0,.65);color:#0d1117;'
           + 'font-weight:800;font-size:'+(n<10?12.5:12)+'px;line-height:'+d+'px;text-align:center;'
           + 'border:1.5px solid rgba(13,17,23,.9)">'+n+'</div>'});
    }
  });
} else { layer = L.layerGroup(); }
map.addLayer(layer);

function popHTML(r){
  var gm = 'https://www.google.com/maps/search/?api=1&query='+r.lat+','+r.lng;
  var h = '<div class="pop"><img src="'+esc(r.img)+'" alt="" loading="lazy"/>';
  h += '<div class="b"><h3>'+esc(r.name)+'</h3><div class="ja">'+esc(r.ja)+'</div><div class="meta">';
  h += '<span class="tag g" style="background:'+COLOR[r.group]+';border-color:'+COLOR[r.group]+'">'+esc(r.cuisineKo)+'</span>';
  h += '<span class="tag p">'+esc(r.price)+'</span><span class="tag">'+esc(r.wardKo)+'구</span>';
  if(r._km!=null) h += '<span class="tag p">'+r._km.toFixed(1)+'km</span>';
  if(r.booking) h += '<span class="tag">예약가능</span>';
  h += '</div><div class="ad">'+esc(r.addr)+(r.postal?' · 〒'+esc(r.postal):'')+'</div>';
  if(r.tel) h += '<div class="ad">☎ <a href="tel:'+esc(r.tel.replace(/[^+\d]/g,''))+'" style="color:#9fb0c3;text-decoration:underline">'+esc(r.tel)+'</a></div>';
  h += '<div class="ds">'+esc(r.desc)+'</div>';
  h += '<div class="lk"><a href="'+esc(r.url)+'" target="_blank" rel="noopener">MICHELIN</a>';
  h += '<a href="'+gm+'" target="_blank" rel="noopener">길찾기</a></div></div></div>';
  return h;
}

R.forEach(function(r){
  r._m = L.marker([r.lat,r.lng],{icon:pinIcon(r,false),title:r.name,__g:r.group});
  r._m.bindPopup(function(){ return popHTML(r); },{maxWidth:MOBILE()?260:290,minWidth:MOBILE()?240:280,autoPanPadding:[18,18],closeButton:true});
  r._m.on('click', function(){ select(r,false); });
});

/* ---------------- chips ---------------- */
function tally(k){ var m={}; R.forEach(function(r){ m[r[k]]=(m[r[k]]||0)+1; }); return m; }
var TG=tally('group'), TP=tally('price'), TW=tally('wardKo');
function buildChips(el, items, set, colored){
  items.forEach(function(it){
    var b=document.createElement('button'); b.className='chip';
    b.innerHTML=(colored?'<span class="dot" style="background:'+COLOR[it.k]+'"></span>':'')
      +'<span>'+esc(it.label)+'</span><span class="n">'+it.n+'</span>';
    b.onclick=function(){ if(set.has(it.k)) set.delete(it.k); else set.add(it.k);
      b.classList.toggle('on', set.has(it.k)); render(); };
    el.appendChild(b);
  });
}
buildChips($('cg'), GORDER.map(function(k){return {k:k,label:GLABEL[k],n:TG[k]||0};}), S.g, true);
buildChips($('cp'), ['¥','¥¥'].map(function(k){return {k:k,label:k+(k==='¥'?' 저가':' 중가'),n:TP[k]||0};}), S.p, false);
buildChips($('cw'), Object.keys(TW).sort(function(a,b){return TW[b]-TW[a];}).map(function(k){return {k:k,label:k,n:TW[k]};}), S.w, false);

/* ---------------- geolocation ---------------- */
var meMarker=null, meCircle=null;
function haversine(a,b,c,d){
  var R0=6371, t=Math.PI/180, dLat=(c-a)*t, dLng=(d-b)*t;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R0*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function applyDist(){
  if(!S.me){ R.forEach(function(r){ r._km=null; }); return; }
  R.forEach(function(r){ r._km = haversine(S.me[0],S.me[1],r.lat,r.lng); });
}
$('gps').onclick = function(){
  if(!navigator.geolocation){ alert('이 브라우저는 위치를 지원하지 않아'); return; }
  var btn=$('gps'); btn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(function(pos){
    btn.classList.remove('busy'); btn.classList.add('on');
    S.me=[pos.coords.latitude,pos.coords.longitude];
    if(meMarker) map.removeLayer(meMarker);
    if(meCircle) map.removeLayer(meCircle);
    meMarker=L.marker(S.me,{icon:L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],html:'<div class="mepin"></div>'}),zIndexOffset:1000}).addTo(map);
    meCircle=L.circle(S.me,{radius:Math.max(pos.coords.accuracy,60),color:'#4aa3ff',weight:1,fillOpacity:.06}).addTo(map);
    applyDist(); S.near=true; $('sortNear').classList.add('on');
    map.setView(S.me, Math.max(map.getZoom(),14));
    render();
  }, function(err){
    btn.classList.remove('busy');
    alert(err.code===1 ? '위치 권한이 꺼져 있어. 설정 > Safari > 위치에서 허용해줘.' : '위치를 못 잡았어. 잠시 후 다시.');
  }, {enableHighAccuracy:true, timeout:9000, maximumAge:60000});
};
$('sortNear').onclick = function(){
  if(!S.me){ $('gps').click(); return; }
  S.near=!S.near; $('sortNear').classList.toggle('on',S.near); render();
};

/* ---------------- render ---------------- */
function match(r){
  if(S.g.size && !S.g.has(r.group)) return false;
  if(S.p.size && !S.p.has(r.price)) return false;
  if(S.w.size && !S.w.has(r.wardKo)) return false;
  if(S.q){
    var hay=(r.name+' '+r.ja+' '+r.cuisine+' '+r.cuisineKo+' '+r.wardKo+' '+r.ward+' '+r.addr).toLowerCase();
    if(hay.indexOf(S.q)===-1) return false;
  }
  return true;
}
function rowHTML(r, showWard){
  return '<div class="item" data-id="'+r.id+'" style="--g:'+COLOR[r.group]+'">'
    + '<div class="l1"><div class="nm">'+esc(r.name)+'</div>'
    + '<div class="rt">'+esc(r.cuisineKo)+'<span class="p">'+esc(r.price)+'</span></div></div>'
    + '<div class="l2"><div class="ja">'+esc(r.ja)+'</div>'
    + '<div class="wd">'+(r._km!=null?'<span class="km">'+r._km.toFixed(1)+'km</span> · ':'')
    + (showWard?esc(r.wardKo)+'구 · ':'')+esc(r.short)+'</div></div></div>';
}
var listEl=$('list');
function render(){
  var vis=R.filter(match);
  layer.clearLayers();
  var ms=vis.map(function(r){ return r._m; });
  if(layer.addLayers) layer.addLayers(ms); else ms.forEach(function(m){ layer.addLayer(m); });

  var h='';
  if(S.near && S.me){
    vis.sort(function(a,b){ return a._km-b._km; });
    h+='<div class="sec">가까운 순 · 내 위치 기준</div>';
    vis.forEach(function(r){ h+=rowHTML(r,true); });
  } else {
    var byW={}; vis.forEach(function(r){ (byW[r.wardKo]=byW[r.wardKo]||[]).push(r); });
    Object.keys(byW).sort(function(a,b){ return byW[b].length-byW[a].length || a.localeCompare(b,'ko'); })
      .forEach(function(w){
        h+='<div class="sec">'+esc(w)+'구 <span style="color:#6b7d92">· '+byW[w].length+'</span></div>';
        byW[w].sort(function(a,b){ return a.cuisineKo.localeCompare(b.cuisineKo,'ko')||a.name.localeCompare(b.name); });
        byW[w].forEach(function(r){ h+=rowHTML(r,false); });
      });
  }
  listEl.innerHTML = h || '<div style="padding:30px 14px;color:#6b7d92;text-align:center">조건에 맞는 식당이 없어</div>';
  $('cnt').innerHTML='<b>'+vis.length+'</b> / '+R.length+'곳';
  $('kpi4').textContent=vis.length;
}
listEl.addEventListener('click', function(e){
  var it=e.target.closest('.item'); if(!it) return;
  var r=R.find(function(x){ return x.id===it.dataset.id; });
  if(r) select(r,true);
});

function flyOffset(r, zoom){
  var target=map.project([r.lat,r.lng], zoom);
  if(MOBILE()) target.y += (map.getSize().y*0.5 - 150) * 0.5;
  map.flyTo(map.unproject(target, zoom), zoom, {duration:.55});
}
function select(r, fromList){
  if(S.sel && S.sel!==r) S.sel._m.setIcon(pinIcon(S.sel,false));
  S.sel=r; r._m.setIcon(pinIcon(r,true));
  Array.prototype.forEach.call(listEl.querySelectorAll('.item.sel'),function(n){ n.classList.remove('sel'); });
  var node=listEl.querySelector('.item[data-id="'+r.id+'"]');
  if(node){ node.classList.add('sel'); if(!fromList) node.scrollIntoView({block:'nearest'}); }
  if(fromList){
    if(MOBILE()) snapTo(0);
    var z=Math.max(map.getZoom(),16);
    flyOffset(r,z);
    setTimeout(function(){
      if(layer.zoomToShowLayer) layer.zoomToShowLayer(r._m,function(){ r._m.openPopup(); });
      else r._m.openPopup();
    }, 600);
  }
}

$('q').addEventListener('input', function(e){ S.q=e.target.value.trim().toLowerCase(); render(); });
$('q').addEventListener('focus', function(){ if(MOBILE()) snapTo(2); });
$('reset').onclick=function(){
  S.q=''; S.g.clear(); S.p.clear(); S.w.clear(); S.near=false;
  $('q').value=''; $('sortNear').classList.remove('on');
  Array.prototype.forEach.call(document.querySelectorAll('.chip.on'),function(c){ c.classList.remove('on'); });
  render();
};
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
  b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(x){ x.classList.remove('on'); });
    Array.prototype.forEach.call(document.querySelectorAll('.pane'),function(x){ x.classList.remove('on'); });
    b.classList.add('on'); $(b.dataset.pane).classList.add('on');
    if(MOBILE() && curSnap===0) snapTo(1);
  };
});

/* ---------------- bottom sheet (mobile) ---------------- */
var sheet=$('side'), curSnap=0;
function snapPx(){
  var h=sheet.getBoundingClientRect().height, vh=window.innerHeight;
  var peek=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek'))||150;
  return [ Math.max(h-peek,0), Math.max(h-vh*0.55,0), 0 ];   // peek / half / full
}
function snapTo(i){
  curSnap=i; sheet.style.setProperty('--ty', snapPx()[i]+'px');
}
(function initSheet(){
  var startY=0, startTy=0, ty=0, dragging=false;
  function cur(){ return parseFloat(getComputedStyle(sheet).getPropertyValue('--ty'))||0; }
  function down(e){
    dragging=true; sheet.classList.add('drag');
    startY=(e.touches?e.touches[0].clientY:e.clientY); startTy=cur(); ty=startTy;
  }
  function move(e){
    if(!dragging) return;
    var y=(e.touches?e.touches[0].clientY:e.clientY);
    var sp=snapPx();
    ty=Math.min(Math.max(startTy+(y-startY),0),sp[0]);
    sheet.style.setProperty('--ty', ty+'px');
    if(e.cancelable) e.preventDefault();
  }
  function up(){
    if(!dragging) return; dragging=false; sheet.classList.remove('drag');
    var sp=snapPx(), best=0, d=1e9;
    sp.forEach(function(v,i){ var dd=Math.abs(ty-v); if(dd<d){ d=dd; best=i; } });
    snapTo(best);
  }
  ['grab','tabs'].forEach(function(){});
  var handles=[$('grab'), document.querySelector('.tabs')];
  handles.forEach(function(el){
    el.addEventListener('touchstart',down,{passive:true});
    el.addEventListener('touchmove',move,{passive:false});
    el.addEventListener('touchend',up);
    el.addEventListener('mousedown',down);
  });
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  $('grab').addEventListener('click',function(){ snapTo(curSnap===0?1:0); });
})();
function syncSheet(){
  if(MOBILE()){ snapTo(curSnap); } else { sheet.style.removeProperty('--ty'); }
  setTimeout(function(){ map.invalidateSize(); },320);
}
window.addEventListener('resize', syncSheet);
window.addEventListener('orientationchange', function(){ setTimeout(syncSheet,350); });

/* ---------------- legend ---------------- */
(function(){
  var h='<b>요리 계통 · 111곳</b>';
  GORDER.forEach(function(k){ h+='<div><i style="background:'+COLOR[k]+'"></i><span>'+GLABEL[k]+'</span><em>'+(TG[k]||0)+'</em></div>'; });
  $('legend').innerHTML=h;
})();

/* ---------------- stats (coords computed, not hand-written) ---------------- */
function drawStats(){
  var W=Math.max(320, Math.min(sheet.clientWidth||340, 520)), PAD=10;
  function measure(txt,px){ var w=0; for(var i=0;i<txt.length;i++){ w += (txt.charCodeAt(i)>0x2E80)?px:px*0.53; } return w; }
  function barChart(title,pairs,colorOf,note,uid){
    var rowH=16, top=27, max=Math.max.apply(null,pairs.map(function(p){return p[1];}));
    var lw=0; pairs.forEach(function(p){ lw=Math.max(lw,measure(p[0],10)); });
    lw=Math.min(Math.ceil(lw)+6,100);
    var x0=PAD+lw, x1=W-PAD-24, H=top+pairs.length*rowH+8;
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
    s+='<defs><marker id="ar'+uid+'" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3d4c5c"/></marker></defs>';
    s+='<text x="'+PAD+'" y="12" fill="#9fb0c3" font-size="10.5" font-weight="800">'+title+'</text>';
    s+='<text x="'+(W-PAD)+'" y="12" fill="#4d5d6f" font-size="9" text-anchor="end">'+note+'</text>';
    s+='<line x1="'+x0+'" y1="'+(top-6)+'" x2="'+(x1+16)+'" y2="'+(top-6)+'" stroke="#26313f" marker-end="url(#ar'+uid+')"/>';
    s+='<line x1="'+x0+'" y1="'+(top-6)+'" x2="'+x0+'" y2="'+(top+pairs.length*rowH-7)+'" stroke="#26313f"/>';
    pairs.forEach(function(p,i){
      var y=top+i*rowH, bw=Math.max(2,(x1-x0)*p[1]/max), c=colorOf(p[0]);
      s+='<text x="'+(x0-5)+'" y="'+(y+4)+'" fill="#9fb0c3" font-size="9.5" text-anchor="end">'+p[0]+'</text>';
      s+='<rect x="'+x0+'" y="'+(y-5)+'" width="'+bw.toFixed(1)+'" height="10" rx="2" fill="'+c+'" opacity=".88"/>';
      s+='<text x="'+(x0+bw+4)+'" y="'+(y+4)+'" fill="#e6edf3" font-size="9.5" font-weight="700">'+p[1]+'</text>';
      s+='<line x1="'+x0+'" y1="'+(y+rowH/2-1)+'" x2="'+(x1+16)+'" y2="'+(y+rowH/2-1)+'" stroke="#161e27"/>';
    });
    return s+'</svg>';
  }
  function pairsOf(k){ var m={}; R.forEach(function(r){ m[r[k]]=(m[r[k]]||0)+1; });
    return Object.keys(m).map(function(x){return [x,m[x]];}).sort(function(a,b){return b[1]-a[1];}); }
  var cuiP=pairsOf('cuisineKo'), wardP=pairsOf('wardKo'), cuiC={};
  R.forEach(function(r){ cuiC[r.cuisineKo]=COLOR[r.group]; });
  function dotMatrix(){
    var wards=wardP.map(function(p){return p[0];}), cell=10, top=29, lw=42;
    var x0=PAD+lw, cw=Math.min(cell,(W-PAD-x0-14)/wardP[0][1]);
    var H=top+wards.length*cell+12;
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
    s+='<text x="'+PAD+'" y="12" fill="#9fb0c3" font-size="10.5" font-weight="800">구 × 가격대 분포</text>';
    s+='<text x="'+(W-PAD)+'" y="12" fill="#4d5d6f" font-size="9" text-anchor="end">진한 점 ¥ · 옅은 점 ¥¥</text>';
    wards.forEach(function(w,i){
      var y=top+i*cell;
      var rows=R.filter(function(r){return r.wardKo===w;}).sort(function(a,b){return a.price.length-b.price.length;});
      s+='<text x="'+(x0-4)+'" y="'+(y+3.5)+'" fill="#9fb0c3" font-size="8.5" text-anchor="end">'+w+'</text>';
      rows.forEach(function(r,j){
        s+='<circle cx="'+(x0+j*cw+cw/2).toFixed(1)+'" cy="'+y+'" r="'+(cw*0.33).toFixed(1)+'" fill="'+COLOR[r.group]+'" opacity="'+(r.price==='¥'?.95:.42)+'"/>';
      });
      s+='<text x="'+(x0+rows.length*cw+4).toFixed(1)+'" y="'+(y+3.5)+'" fill="#4d5d6f" font-size="8">'+rows.length+'</text>';
    });
    return s+'</svg>';
  }
  $('stats').innerHTML = barChart('요리 종류별 · 20종',cuiP,function(k){return cuiC[k];},'단위: 곳','a')
    + barChart('행정구별 · 19구',wardP,function(){return '#7b8ea3';},'단위: 곳','b')
    + dotMatrix();
}
drawStats();
window.addEventListener('resize', drawStats);

$('stamp').textContent='좌표 111/111 · 주소 111/111 · 일본어 상호 111/111';

render();
if(MOBILE()) snapTo(0); else sheet.style.removeProperty('--ty');
setTimeout(function(){ map.invalidateSize(); }, 250);
})();
</script>
